 <span>📘 بيانات تحضير منصة مدرستي</span>
 <label style="background:white;color:#075a4f;border-radius:10px;padding:9px 15px;cursor:pointer">📂 تحميل النسخة الاحتياطية <input id="sh-local-backup" type="file" accept=".json,application/json" style="display:none"></label>
 <span id="sh-import-state" role="status">إذا لم تظهر الأسماء، اختر ملف بيانات التحضير JSON</span>
 </div>


<header class="top">
  <div>
    <h1>سجل حضور شرحبيل</h1>

  </div>

  </nav>

</main>

<div id="modal" class="modal" hidden></div>

<script>
"use strict";
/* ---------- constants ---------- */
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const PN={1:'الأولى',2:'الثانية',3:'الثالثة',4:'الرابعة',5:'الخامسة',6:'السادسة',7:'السابعة'};
const GN={1:'الأول',2:'الثاني',3:'الثالث'};
const CL=['أ','ب','ج','د','هـ','و','ز','ح'];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toAr=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>e.hidden=true,ms)}

/* ---------- state ---------- */
const S={db:null,sample:null,downloads:null,roster:[],byId:new Map(),tt:[],index:[],settings:{aliases:[]},
  view:'day',dayDate:null,day:null,dayTab:'sessions',unsubDay:null,stuFilter:{q:'',g:'',c:''},stuPage:0,ttDay:1,rep:{from:'',to:''},absMode:'never'};

/* ---------- name matching ---------- */
function norm(s){
  s=String(s||'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ئ/g,'ي').replace(/[ً-ْـ]/g,'')
    .replace(/\(.*?\)|\*|…|\d+/g,' ').replace(/عبد\s+ال/g,'عبدال').replace(/بالحارث/g,'الحارث');
  const t=s.split(/\s+/).filter(Boolean),out=[];
  for(let i=0;i<t.length;i++){const w=t[i];if(w==='بن'||w==='بنت')continue;if(w==='ال'&&i+1<t.length){out.push('ال'+t[i+1]);i++;continue}out.push(w)}
  return out.map(x=>x.startsWith('ال')&&x.length>4?x.slice(2):x).map(x=>['يحي','يحى','يحيي'].includes(x)?'يحيي':x);
}
function subseq(a,b){let j=0;for(const x of a){while(j<b.length&&b[j]!==x)j++;if(j===b.length)return false;j++}return true}
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const ratio=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
function cands(tok,pool){return pool.filter(r=>{const t=r._t;if(!t.length||t[0]!==tok[0])return false;if(tok.length===1)return true;if(tok[tok.length-1]!==t[t.length-1])return false;return subseq(tok.slice(1,-1),t.slice(1,-1))})}
function cands2(tok,pool){return pool.filter(r=>{const t=r._t;return t.length>1&&tok.length>1&&t[0]===tok[0]&&t[t.length-1]===tok[tok.length-1]&&subseq(t.slice(1,-1),tok.slice(1,-1))})}
function tokScore(a,b){let hit=0;const used=new Set();for(const x of a){let bi=-1,bv=0;b.forEach((y,j)=>{if(used.has(j))return;const v=x===y?1:ratio(x,y);if(v>bv){bv=v;bi=j}});if(bv>=.8){hit++;used.add(bi)}}return hit/Math.max(a.length,b.length)}
function matchName(name,g,c,exclude){
  const tok=norm(name);if(!tok.length)return{i:'',cands:[],how:'none'};
  const ex=exclude||new Set();
  const cls=S.roster.filter(r=>r.g==g&&r.c===c), gr=S.roster.filter(r=>r.g==g);
  let cc=cls.filter(r=>r.n===name); let how='exact';
  if(!cc.length)cc=cands(tok,cls);
  if(!cc.length)cc=cands2(tok,cls);
  if(!cc.length&&tok.length>1)cc=cls.filter(r=>r._t[0]===tok[0]&&subseq(tok.slice(1),r._t.slice(1)));
  if(!cc.length){cc=cands(tok,gr);how='grade'}
  if(!cc.length){cc=cands2(tok,gr);how='grade'}
  if(!cc.length){const tj=tok.join(' ');let best=null,bs=0;for(const r of cls){const v=ratio(tj,r._t.join(' '));if(v>bs){bs=v;best=r}}if(best&&bs>=.84){cc=[best];how='fuzzy'}}
  if(!cc.length&&tok.length>1){const sc=cls.filter(r=>r._t.length&&ratio(r._t[0],tok[0])>=.8).map(r=>[tokScore(tok,r._t),r]).sort((a,b)=>b[0]-a[0]);if(sc.length&&sc[0][0]>=.6&&(!sc[1]||sc[1][0]<sc[0][0]-.15)){cc=[sc[0][1]];how='fuzzy'}}
  const free=cc.filter(r=>!ex.has(r.i));
  const use=free.length?free:cc;
  if(use.length===1)return{i:use[0].i,cands:use,how};
  return{i:'',cands:use.slice(0,8),how:use.length?'ambiguous':'none'};
}
function matchSession(sess){
  const used=new Set(sess.m.filter(x=>x.i).map(x=>x.i));
  for(const x of sess.m){if(x.i)continue;const r=matchName(x.n,sess.g,sess.c,used);if(r.i){x.i=r.i;used.add(r.i);if(r.how==='grade'){const s=S.byId.get(r.i);if(s)x.nt=`مسجّل بفصل (${s.c})`}if(r.how==='fuzzy')x.nt='تطابق تقريبي'}else x.cand=r.cands.map(c=>c.i)}
  return sess;
}

/* ---------- db helpers ---------- */
async function getDoc(p){try{const s=await S.db.doc(p).get();return s.exists?structuredClone(s.data()):null}catch(e){return null}}
async function setDoc(p,data){
  try{await S.db.doc(p).set(data);return true}catch(e){
    if(e&&e.code==='quota_exceeded')toast('مساحة البيانات ممتلئة. احذف أيامًا قديمة ثم أعد المحاولة.');
    else if(e&&e.code==='invalid_argument')toast('لا تملك صلاحية التعديل على هذا التطبيق.');
    else toast('تعذّر الحفظ، حاول مرة أخرى.');return false}
}
function setRoster(list){S.roster=list.map(r=>({...r,_t:norm(r.n)}));S.byId=new Map(S.roster.map(r=>[r.i,r]))}
async function saveRoster(){const students=S.roster.map(({_t,...r})=>r);return setDoc('app/roster',{students,updatedAt:new Date().toISOString()})}
async function saveIndex(){return setDoc('app/index',{days:S.index})}
async function saveDay(){
  if(!S.day)return;S.day.updatedAt=new Date().toISOString();
  const ok=await setDoc('days/'+S.day.date,S.day);S.allDays=null;S.stuStats=null;
  if(ok){const it=S.index.find(d=>d.date===S.day.date),cnt=S.day.sessions.length;
    if(it){if(it.count!==cnt){it.count=cnt;await saveIndex()}}else{S.index.push({date:S.day.date,label:S.day.label,wd:S.day.wd,count:cnt});S.index.sort((a,b)=>b.date.localeCompare(a.date));await saveIndex()}}
  return ok;
}

/* ---------- day computations ---------- */
const skey=s=>`${s.g}|${s.c}|${s.p}`;
function ttFor(wd){return S.tt.filter(e=>e.d===wd)}
function expected(wd){return ttFor(wd).filter(e=>!e.w&&e.s)}
function missingTeachers(day,maxP){
  const got=new Map(day.sessions.map(s=>[skey(s),s]));
  return expected(day.wd).filter(e=>!maxP||e.p<=maxP).map(e=>{const s=got.get(`${e.g}|${e.c}|${e.p}`);
    if(s&&teacherEq(s.t,e.t))return null;return{...e,other:s?`وصل كشف «${s.s}» باسم ${s.t}`:''}}).filter(Boolean).sort((a,b)=>a.p-b.p||a.g-b.g||CL.indexOf(a.c)-CL.indexOf(b.c));
}
function teacherEq(a,b){const n=x=>norm(x).join('');return n(a).slice(0,6)===n(b).slice(0,6)}
function dayAbsence(day){
  const seen=new Map();// id -> set(p)
  for(const s of day.sessions)for(const x of s.m)if(x.i){if(!seen.has(x.i))seen.set(x.i,new Set());seen.get(x.i).add(s.p)}
  const byClass=new Map();
  for(const s of day.sessions){if(s.partial)continue;const k=s.g+'|'+s.c;if(!byClass.has(k))byClass.set(k,[]);byClass.get(k).push(s)}
  const out=[];
  for(const r of S.roster){const ss=byClass.get(r.g+'|'+r.c);if(!ss)continue;const pp=seen.get(r.i)||new Set();
    const miss=[],unsure=[];const tok=r._t;
    for(const s of ss.slice().sort((a,b)=>a.p-b.p)){if(pp.has(s.p))continue;
      const poss=s.m.some(x=>!x.i&&(()=>{const t=norm(x.n);return t[0]===tok[0]&&t[t.length-1]===tok[tok.length-1]})());
      (poss?unsure:miss).push(s)}
    if(miss.length||unsure.length)out.push({r,miss,unsure,tot:ss.length,never:pp.size===0});
  }
  return out.sort((a,b)=>a.r.g-b.r.g||CL.indexOf(a.r.c)-CL.indexOf(b.r.c)||b.miss.length-a.miss.length||a.r.n.localeCompare(b.r.n,'ar'));
}
function sessStats(s){const m=s.m.length,ok=s.m.filter(x=>x.i).length,late=s.m.filter(x=>x.st==='متأخر').length;return{m,ok,late}}

/* ---------- render shell ---------- */
function setView(v){S.view=v;document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v));render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});
function render(){
  const app=$('#app');app.onclick=null;app.onchange=null;
  if(!S.db){app.innerHTML=`<div class="empty">هذا التطبيق يحفظ بياناته داخل Claude. افتحه من رابط Claude وسجّل الدخول لتظهر الأيام والطلاب.</div>`;return}
  if(S.view==='day')renderDay(app);else if(S.view==='reports')renderReports(app);else if(S.view==='students')renderStudents(app);else if(S.view==='tt')renderTT(app);else renderSettings(app);
}

/* ---------- days view ---------- */
function renderDay(app){
  const days=S.index.slice().sort((a,b)=>b.date.localeCompare(a.date));
  app.innerHTML=`<div class="grid">
  <aside class="card rail stack">
    <div><h2>الأيام</h2>
    <div class="daylist" id="daylist">${days.length?days.map(d=>`<button class="dayitem" data-d="${d.date}" aria-current="${d.date===S.dayDate}"><span>${esc(hijri(d.date))}</span><small>${toAr(d.count||0)} حصة</small></button>`).join(''):'<div class="muted small">لا توجد أيام بعد. لنقل بياناتك: الإعدادات ← استيراد نسخة احتياطية.</div>'}</div></div>
    <div class="stack"><h2>يوم جديد</h2>
      <div class="hpick"><button class="hfield" id="hfield" type="button" aria-haspopup="dialog"><span id="hftxt">اختر التاريخ</span><span aria-hidden="true">▾</span></button><div id="hcal" class="hpop" hidden></div></div>
      <div class="muted small" id="hprev"></div>
      <button class="btn primary" id="addday">إنشاء اليوم</button>
      <button class="btn" id="waimp">استيراد من محادثة واتساب</button>
      <div class="muted small">اضغط على الخانة لاختيار اليوم من التقويم الهجري. الأيام الملوّنة مسجّلة.</div></div>
  </aside>
  <section class="card" id="daymain">${S.day?'':'<div class="empty">اختر يومًا من القائمة أو أنشئ يومًا جديدًا.</div>'}</section></div>`;
  $('#daylist').onclick=e=>{const b=e.target.closest('[data-d]');if(b)openDay(b.dataset.d)};
  if(!S.cal){const h=hijriNow();S.cal={y:h.year,m:h.month,sel:new Date().toISOString().slice(0,10)}}
  const hv=()=>S.cal.sel;
  const drawCal=()=>{const {y,m}=S.cal;const days=hMonthDays(y,m);const have=new Map(S.index.map(x=>[x.date,x.count||0]));const today=new Date().toISOString().slice(0,10);
    const lead=days.length?days[0].wd:0;
    $('#hcal').innerHTML=`<div class="hcal"><div class="hcal-h"><button class="btn small" data-mv="-1" aria-label="الشهر السابق">›</button><b>${HM_NAMES[m-1]} ${toAr(y)} هـ</b><button class="btn small" data-mv="1" aria-label="الشهر التالي">‹</button></div>
    <div class="hcal-g">${['ح','ن','ث','ر','خ','ج','س'].map(x=>`<span class="hcal-w">${x}</span>`).join('')}${'<span></span>'.repeat(lead)}${days.map(x=>{const h=have.has(x.g);const cls=['hcal-d',h?'has':'',x.g===today?'today':'',x.g===S.cal.sel?'sel':'',x.wd>4?'off':''].join(' ');
      return`<button class="${cls}" data-g="${x.g}" title="${esc(hijri(x.g))}${h?' — '+have.get(x.g)+' حصة':''}">${toAr(x.d)}</button>`}).join('')}</div>
    <div class="hcal-k small muted"><span><i class="dot has"></i> يوم مسجّل</span><span><i class="dot today"></i> اليوم</span><button class="btn small" data-mv="0">العودة لليوم</button></div></div>`;
    const v=S.cal.sel;
    $('#hftxt').textContent=v?hijri(v):'اختر التاريخ';$('#hprev').textContent=v&&have.has(v)?'هذا اليوم مسجّل':'';
    $('#addday').textContent=v&&have.has(v)?'فتح اليوم':'إنشاء اليوم';$('#addday').disabled=!v};
  $('#hfield').onclick=e=>{e.stopPropagation();const pop=$('#hcal');pop.hidden=!pop.hidden;if(!pop.hidden)drawCal()};
  if(!S._calDoc){S._calDoc=1;document.addEventListener('click',e=>{const pop=$('#hcal');if(pop&&!pop.hidden&&!e.target.closest('.hpick'))pop.hidden=true})}
  $('#hcal').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.mv!=null){const mv=+b.dataset.mv;if(!mv){const h=hijriNow();S.cal.y=h.year;S.cal.m=h.month}else{let m=S.cal.m+mv,y=S.cal.y;if(m<1){m=12;y--}if(m>12){m=1;y++}S.cal.m=m;S.cal.y=y}drawCal();return}
    if(b.dataset.g){S.cal.sel=b.dataset.g;$('#hcal').hidden=true;if(S.index.some(x=>x.date===b.dataset.g)){openDay(b.dataset.g);return}drawCal()}};
  drawCal();
  $('#waimp').onclick=()=>waImport();
  $('#addday').onclick=async()=>{const v=hv();if(!v){toast('اختر تاريخًا صحيحًا');return}const d=new Date(v+'T12:00:00');const wd=d.getDay();
    if(wd>4){toast('هذا اليوم '+WD[wd]+' وليس يوم دراسة');}
    if(S.index.some(x=>x.date===v)){openDay(v);return}
    const label=hijri(v);
    S.day={date:v,wd,label,sessions:[]};S.dayDate=v;await saveDay();openDay(v)};
  if(S.day)renderDayMain();

function openDay(date){
  S.dayDate=date;if(S.unsubDay)S.unsubDay();
  S.unsubDay=S.db.doc('days/'+date).onSnapshot(sn=>{if(!sn.exists)return;const d=structuredClone(sn.data());if(S.editing)return;S.day=d;if(S.view==='day'){if(!$('#daymain'))render();else renderDayMain();document.querySelectorAll('.dayitem').forEach(b=>b.setAttribute('aria-current',b.dataset.d===date))}},()=>{});
  if(S.view!=='day')setView('day');else render();
}
function renderDayMain(){
  const el=$('#daymain');if(!el||!S.day)return;const d=S.day;
  const exp=expected(d.wd),miss=missingTeachers(d),abs=dayAbsence(d);
  const present=new Set();d.sessions.forEach(s=>s.m.forEach(x=>x.i&&present.add(x.i)));
  const tabs=[['sessions','الحصص'],['import','استيراد'],['missing','المعلمون غير المرسلين'],['absent','الغائبون']];
  el.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">${esc(hijri(d.date))}</h2>
    <div class="row"><button class="btn small primary" id="xday">تصدير تقرير اليوم</button><button class="btn small danger" id="delday">حذف اليوم</button></div></div>
  <div class="tiles">
    <div class="tile ok"><b>${toAr(d.sessions.length)}</b><span>حصة وصل كشفها من ${toAr(exp.length)}</span></div>
    <div class="tile warn"><b>${toAr(miss.length)}</b><span>حصة لم يصل كشفها</span></div>
    <div class="tile"><b>${toAr(present.size)}</b><span>طالب حضر حصة على الأقل</span></div>
    <div class="tile bad"><b>${toAr(abs.filter(a=>a.never).length)}</b><span>طالب لم يحضر أي حصة</span></div>
  </div>
  <div class="tabs" id="daytabs">${tabs.map(([k,t])=>`<button data-t="${k}" aria-current="${S.dayTab===k}">${t}</button>`).join('')}</div>
  <div id="daytab"></div>`;
  $('#daytabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){S.dayTab=b.dataset.t;renderDayMain()}};
  $('#xday').onclick=()=>exportMenu(()=>dayModel(d,'all'));
  $('#delday').onclick=()=>confirmBox(`حذف ${hijri(d.date)} وكل كشوفه؟ لا يمكن التراجع.`,async()=>{await S.db.doc('days/'+d.date).delete().catch(()=>{});S.index=S.index.filter(x=>x.date!==d.date);await saveIndex();if(S.unsubDay)S.unsubDay();S.day=null;S.dayDate=null;render();toast('حُذف اليوم')});
  const t=$('#daytab');
  if(S.dayTab==='sessions')tabSessions(t,d);else if(S.dayTab==='import')tabImport(t,d);else if(S.dayTab==='missing')tabMissing(t,d,miss);else tabAbsent(t,d,abs);
}
function tabSessions(t,d){
  const ss=d.sessions.slice().sort((a,b)=>a.p-b.p||a.g-b.g||CL.indexOf(a.c)-CL.indexOf(b.c));
  t.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn" id="addsess">إضافة حصة يدويًا</button><span class="muted small">اضغط على الحصة لعرض الطلاب وتعديلهم.</span></div>
  ${ss.length?ss.map(s=>{const st=sessStats(s);return`<details class="sess" data-k="${skey(s)}"><summary><span class="per">${PN[s.p]||s.p}</span><b>${GN[s.g]||s.g} (${esc(s.c)})</b><span>${esc(s.s)}</span><span class="muted">${esc(s.t)}</span>
   <span class="pill ok">${toAr(st.m)} حاضر</span>${st.late?`<span class="pill warn">${toAr(st.late)} متأخر</span>`:''}${st.m-st.ok?`<span class="pill bad">${toAr(st.m-st.ok)} غير مطابق</span>`:''}${s.partial?'<span class="pill warn">كشف جزئي</span>':''}${s.counts?`<span class="pill mut">النظام: ${toAr(s.counts.present||0)} حاضر · ${toAr(s.counts.absent||0)} غائب</span>`:''}</summary><div class="body"></div></details>`}).join(''):'<div class="empty">لا توجد كشوف لهذا اليوم بعد. افتح تبويب «استيراد» وأضف الصور أو الملفات.</div>'}`;
  t.querySelectorAll('details.sess').forEach(det=>det.addEventListener('toggle',()=>{if(det.open){const s=d.sessions.find(x=>skey(x)===det.dataset.k);det.querySelector('.body').innerHTML=sessBody(s)}}));
  t.onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const k=b.closest('details').dataset.k;const s=d.sessions.find(x=>skey(x)===k);
    if(b.dataset.act==='edit')editSession(s);
    if(b.dataset.act==='del')confirmBox('حذف هذا الكشف من اليوم؟',async()=>{d.sessions=d.sessions.filter(x=>x!==s);await saveDay();renderDayMain();toast('حُذف الكشف')});};
  $('#addsess').onclick=()=>editSession(null);
}
function sessBody(s){
  const rows=s.m.map((x,i)=>{const r=x.i&&S.byId.get(x.i);return`<tr><td class="num">${toAr(i+1)}</td><td>${r?esc(r.n):`<span class="pill bad">غير مطابق</span> ${esc(x.n)}`}${r&&r.n!==x.n?`<div class="muted small">في الكشف: ${esc(x.n)}</div>`:''}</td><td class="num k">${r?esc(r.i):'—'}</td><td class="num k">${r?esc(r.p||'—'):'—'}</td><td>${x.st==='متأخر'?'<span class="pill warn">متأخر</span>':'<span class="pill ok">حاضر</span>'}</td><td class="muted small">${esc(x.nt||'')}</td></tr>`}).join('');
  return`${s.note?`<div class="muted small" style="margin-bottom:6px">${esc(s.note)}</div>`:''}<div class="tbl"><table><thead><tr><th class="num">م</th><th>الطالب</th><th class="num">السجل</th><th class="num">الجوال</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="row" style="margin-top:8px"><button class="btn small" data-act="edit">تعديل الكشف</button><button class="btn small danger" data-act="del">حذف الكشف</button></div>`;
}
function tabMissing(t,d){
  const maxSel=S.missMax||7;const m=missingTeachers(d,maxSel);
  const byT={};m.forEach(e=>byT[e.t]=(byT[e.t]||0)+1);
  t.innerHTML=`<div class="row" style="margin-bottom:10px"><label for="missmax">حتى الحصة</label><select id="missmax">${[1,2,3,4,5,6,7].map(p=>`<option value="${p}" ${p===maxSel?'selected':''}>${PN[p]}</option>`).join('')}</select>
   <span class="muted small">${toAr(m.length)} حصة لـ ${toAr(Object.keys(byT).length)} معلمًا — حصص الانتظار غير محسوبة.</span><button class="btn small" id="xmiss">تصدير</button></div>
  ${m.length?`<div class="tbl"><table><thead><tr><th>الحصة</th><th>المعلم</th><th>المادة</th><th>الصف</th><th>الفصل</th><th>ملاحظة</th></tr></thead><tbody>${m.map(e=>`<tr><td>${PN[e.p]}</td><td><b>${esc(e.t)}</b></td><td>${esc(e.s)}</td><td>${GN[e.g]}</td><td>${esc(e.c)}</td><td class="muted small">${esc(e.other)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">وصلت كل الكشوف حتى هذه الحصة.</div>'}`;
  $('#missmax').onchange=e=>{S.missMax=+e.target.value;renderDayMain()};
  $('#xmiss').onclick=()=>exportMenu(()=>dayModel(d,'missing'));
}
function tabAbsent(t,d,abs){
  const list=S.absMode==='never'?abs.filter(a=>a.never):abs;
  t.innerHTML=`<div class="row" style="margin-bottom:10px"><select id="absmode"><option value="never" ${S.absMode==='never'?'selected':''}>لم يحضروا أي حصة</option><option value="any" ${S.absMode==='any'?'selected':''}>غابوا عن حصة أو أكثر</option></select>
   <span class="muted small">${toAr(list.length)} طالبًا. الغياب محسوب من الكشوف المستلمة فقط، والكشوف الجزئية مستبعدة.</span>
   <button class="btn small" id="xabs">تصدير</button><button class="btn small" id="cpph">نسخ أرقام الجوال</button></div>
  ${list.length?`<div class="tbl"><table><thead><tr><th class="num">م</th><th>الطالب</th><th>الصف</th><th>الفصل</th><th class="num">السجل</th><th class="num">الجوال</th><th>الحصص التي غاب عنها</th></tr></thead><tbody>${(()=>{let last='',i=0;return list.map(a=>{const k=a.r.g+a.r.c;let h='';if(k!==last){last=k;h=`<tr class="grp"><td colspan="7">${GN[a.r.g]} الثانوي (${esc(a.r.c)}) — ${toAr(list.filter(x=>x.r.g+x.r.c===k).length)} طالبًا</td></tr>`}i++;
    return h+`<tr><td class="num">${toAr(i)}</td><td><b>${esc(a.r.n)}</b></td><td>${GN[a.r.g]}</td><td>${esc(a.r.c)}</td><td class="num k">${esc(a.r.i)}</td><td class="num k">${esc(a.r.p||'—')}</td><td class="small">${a.miss.map(s=>`${PN[s.p]} (${esc(s.s)})`).join('، ')}${a.unsure.length?` <span class="pill warn">يُرجى التأكد: ${a.unsure.map(s=>PN[s.p]).join('، ')}</span>`:''}</td></tr>`}).join('')})()}</tbody></table></div>`:'<div class="empty">لا يوجد غياب محسوب لهذا اليوم بعد.</div>'}`;
  $('#absmode').onchange=e=>{S.absMode=e.target.value;renderDayMain()};
  $('#xabs').onclick=()=>exportMenu(()=>dayModel(d,'absent'));
  $('#cpph').onclick=()=>copyText(list.map(a=>`${a.r.n}\t${a.r.p||''}`).join('\n'));
}

/* ---------- session editor ---------- */
function editSession(s,{onSave,preview}={}){
  const d=S.day;const orig=s;const w=s?structuredClone(s):{g:1,c:'أ',p:1,s:'',t:'',m:[]};
  S.editing=true;
  const m=$('#modal');m.hidden=false;
  const draw=()=>{
    const used=new Set();
    m.innerHTML=`<div class="card stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${orig?'تعديل الكشف':'كشف جديد'}</h2><button class="btn small" id="mx">إغلاق</button></div>
    <div class="row">
      <label>الصف <select id="eg">${[1,2,3].map(g=>`<option value="${g}" ${w.g==g?'selected':''}>${GN[g]}</option>`).join('')}</select></label>
      <label>الفصل <select id="ec">${CL.map(c=>`<option ${w.c===c?'selected':''}>${c}</option>`).join('')}</select></label>
      <label>الحصة <select id="ep">${[1,2,3,4,5,6,7].map(p=>`<option value="${p}" ${w.p==p?'selected':''}>${PN[p]}</option>`).join('')}</select></label>
      <button class="btn small" id="fromtt">املأ المادة والمعلم من الجدول</button>
    </div>
    <div class="row"><label class="flex1">المادة <input type="text" id="es" value="${esc(w.s)}" style="width:100%"></label><label class="flex1">المعلم <input type="text" id="et" value="${esc(w.t)}" style="width:100%"></label></div>
    <div class="row"><label class="flex1">ملاحظة <input type="text" id="en" value="${esc(w.note||'')}" style="width:100%"></label><label><input type="checkbox" id="epart" ${w.partial?'checked':''}> كشف جزئي (لا يُحسب في الغياب)</label></div>
    <div class="tbl"><table><thead><tr><th class="num">م</th><th>الاسم في الكشف</th><th>الطالب المطابق</th><th>الحالة</th><th></th></tr></thead><tbody>
    ${w.m.map((x,i)=>{const r=x.i&&S.byId.get(x.i);if(x.i)used.add(x.i);const cl=(x.cand||[]).map(id=>S.byId.get(id)).filter(Boolean);
      return`<tr data-i="${i}"><td class="num">${toAr(i+1)}</td><td><input type="text" data-f="n" value="${esc(x.n)}" style="width:100%"></td>
      <td>${r?`<b>${esc(r.n)}</b> <span class="muted small">${GN[r.g]} (${esc(r.c)})</span> <button class="btn small" data-a="unl">فك</button>`:`<span class="pill bad">غير مطابق</span> ${cl.map(c=>`<button class="btn small cand" data-a="pick" data-id="${c.i}">${esc(c.n)} — ${GN[c.g]} (${esc(c.c)})</button>`).join(' ')} <button class="btn small" data-a="find">بحث</button>`}</td>
      <td><select data-f="st"><option ${x.st!=='متأخر'?'selected':''}>حاضر</option><option ${x.st==='متأخر'?'selected':''}>متأخر</option></select></td>
      <td><button class="btn small danger" data-a="rm">حذف</button></td></tr>`}).join('')}
    </tbody></table></div>
    <div class="row"><input type="text" id="addn" placeholder="أضف اسمًا أو الصق عدة أسماء (اسم في كل سطر)" class="flex1"><button class="btn" id="addb">إضافة</button><button class="btn" id="rem">إعادة المطابقة</button></div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" id="msave">${preview?'تم':'حفظ الكشف'}</button></div></div>`;
  };
  const readHead=()=>{w.g=+$('#eg').value;w.c=$('#ec').value;w.p=+$('#ep').value;w.s=$('#es').value.trim();w.t=$('#et').value.trim();w.note=$('#en').value.trim()||undefined;w.partial=$('#epart').checked||undefined;
    m.querySelectorAll('tr[data-i]').forEach(tr=>{const x=w.m[+tr.dataset.i];x.n=tr.querySelector('[data-f=n]').value.trim();const st=tr.querySelector('[data-f=st]').value;if(st==='متأخر')x.st='متأخر';else delete x.st})};
  draw();
  const close=()=>{m.hidden=true;m.innerHTML='';S.editing=false;if(!preview&&S.dayDate)openDay(S.dayDate)};
  m.onclick=async e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='mx'){close();return}
    readHead();
    if(b.id==='fromtt'){const e2=ttFor(d.wd).find(x=>x.g==w.g&&x.c===w.c&&x.p==w.p&&!x.w);if(e2){w.s=e2.s;w.t=e2.t}else toast('لا توجد حصة لهذا الفصل في الجدول');draw();return}
    if(b.id==='addb'){const v=$('#addn').value.split(/\n|،|,/).map(x=>x.trim()).filter(Boolean);v.forEach(n=>w.m.push({n,i:''}));matchSession(w);draw();return}
    if(b.id==='rem'){w.m.forEach(x=>{if(!x.locked){x.i='';delete x.nt}});matchSession(w);draw();return}
    if(b.id==='msave'){
      if(!w.s||!w.t){toast('اكتب المادة والمعلم أو املأهما من الجدول');return}
      w.m.forEach(x=>{delete x.cand});
      if(preview){Object.assign(orig,w);m.hidden=true;m.innerHTML='';S.editing=false;if(onSave)onSave();return}
      const k=skey(w);
      const other=d.sessions.find(x=>x!==orig&&skey(x)===k);
      if(other){other.m=mergeNames(other.m,w.m);other.s=w.s;other.t=w.t;if(orig)d.sessions=d.sessions.filter(x=>x!==orig)}
      else if(orig)Object.assign(orig,w);else d.sessions.push(w);
      if(onSave)onSave(w);
      S.editing=false;const ok=await saveDay();m.hidden=true;m.innerHTML='';if(ok)toast('حُفظ الكشف');openDay(d.date);return}
    const tr=b.closest('tr[data-i]');if(!tr)return;const x=w.m[+tr.dataset.i];
    if(b.dataset.a==='rm'){w.m.splice(+tr.dataset.i,1);draw()}

  for(const d of days){const ss=d.sessions.filter(s=>s.g==r.g&&s.c===r.c&&!s.partial).sort(sortS);const a=d.sessions.filter(s=>s.m.some(x=>x.i===r.i)).sort(sortS);
    const ms=ss.filter(s=>!a.some(x=>x.p===s.p));att+=a.length;mis+=ms.length;if(!a.length&&ss.length)full++;
    rows.push([hijri(d.date),a.map(s=>`${PN[s.p]} (${s.s})`).join('، ')||'—',ms.map(s=>`${PN[s.p]} (${s.s})`).join('، ')||'—',!a.length&&ss.length?'لم يحضر أي حصة':(ms.length?`غاب ${ms.length}`:'حاضر')])}
  return{title:'سجل حضور طالب',sub:r.n,file:`سجل_حضور_${r.n}`.replace(/\s+/g,'_'),
    meta:[['الطالب',r.n],['الصف والفصل',`${GN[r.g]} الثانوي (${r.c||'—'})`],['السجل المدني',r.i],['الجوال',r.p||'—'],['الحصص التي حضرها',att],['الحصص التي غاب عنها',mis],['أيام لم يحضر فيها أي حصة',full],['عدد الأيام',days.length]],
    blocks:[{h:'الحضور يومًا بيوم',cols:[{t:'اليوم',w:2.2},{t:'حضر',w:3},{t:'غاب',w:3},{t:'الحالة',w:1.3,c:1}],rows}],
    notes:['الغياب محسوب من الكشوف المستلمة لفصل الطالب فقط.'],_rows:rows,_days:days};
}

async function toJpeg(src,max=1600){const img=src instanceof HTMLCanvasElement?src:await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(src)});
  const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,s=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(ok=>c.toBlob(ok,'image/jpeg',.85))}
async function videoFrames(file){
  const v=document.createElement('video');v.preload='auto';v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(file);
  await new Promise((ok,no)=>{v.onloadeddata=ok;v.onerror=()=>no(new Error('تعذّر قراءة الفيديو'))});
  const dur=v.duration||0,W=v.videoWidth,H=v.videoHeight,sc=Math.min(1,1400/Math.max(W,H));
  const c=document.createElement('canvas');c.width=Math.round(W*sc);c.height=Math.round(H*sc);const g=c.getContext('2d',{willReadFrequently:true});
  const t=document.createElement('canvas');t.width=48;t.height=48;const tg=t.getContext('2d',{willReadFrequently:true});
  let prev=null;const out=[];const step=Math.max(.5,dur/90);
  for(let ts=0.2;ts<dur;ts+=step){v.currentTime=ts;await new Promise(ok=>v.onseeked=ok);g.drawImage(v,0,0,c.width,c.height);tg.drawImage(c,0,0,48,48);const px=tg.getImageData(0,0,48,48).data;
    let diff=1e9;if(prev){diff=0;for(let i=0;i<px.length;i+=4)diff+=Math.abs(px[i]-prev[i]);diff/=2304}
    if(diff>9){out.push(await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82)));prev=px}
    chk();if(PG.span)progSet(PG.span[0]+PG.span[1]*Math.min(1,ts/dur),`استخراج لقطات الفيديو ${file.name} — ${toAr(out.length)} لقطة`);
    if(out.length>=60)break}
  log(`الفيديو ${file.name}: ${toAr(out.length)} لقطة مختلفة`);return out;
}
async function pdfParts(file){
  await lib('pdf');const pdfjs=window.pdfjsLib;pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;const imgs=[];
  for(let i=1;i<=Math.min(doc.numPages,12);i++){const pg=await doc.getPage(i);const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;imgs.push(await toJpeg(c));chk();if(PG.span)progSet(PG.span[0]+PG.span[1]*i/Math.min(doc.numPages,12),`قراءة صفحات ${file.name}: ${toAr(i)} من ${toAr(Math.min(doc.numPages,12))}`)}
  log(`PDF ${file.name}: ${toAr(imgs.length)} صفحة`);return imgs;
}

/* ---------- WhatsApp chat filtering by day ---------- */
function filterChat(raw,date){
  const ar=s=>s.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[‎‏‪-‮؜]/g,'');
  const lines=raw.split(/\r?\n/);const [Y,M,D]=date.split('-').map(Number);
  const hdr=/^\[?(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})[،,]?\s/;
  let dm=0,md=0;for(const L of lines.slice(0,4000)){const m=ar(L).match(hdr);if(m){if(+m[1]>12)dm++;if(+m[2]>12)md++}}
  const dayFirst=dm>=md;
  const out=[],files=new Set();let keep=false;
  for(const L of lines){const t=ar(L);const m=t.match(hdr);
    if(m){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;const dd=dayFirst?a:b,mm=dayFirst?b:a;keep=(dd===D&&mm===M&&y===Y)}
    if(keep){out.push(L);const fm=t.match(/([\w\-]+\.(?:jpe?g|png|webp|gif|pdf|mp4|mov|opus|docx|xlsx))/gi);if(fm)fm.forEach(x=>files.add(x))}}
  return{text:out.join('\n'),files};
}

function chatDates(raw){
  const ar=s=>s.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[‎‏‪-‮؜]/g,'');
  const lines=raw.split(/\r?\n/);const hdr=/^\[?(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})[،,]?\s/;
  let dm=0,md=0;for(const L of lines.slice(0,4000)){const m=ar(L).match(hdr);if(m){if(+m[1]>12)dm++;if(+m[2]>12)md++}}
  const dayFirst=dm>=md;const out=new Map();let cur=null;
  for(const L of lines){const t=ar(L);const m=t.match(hdr);
    if(m){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;const dd=dayFirst?a:b,mm=dayFirst?b:a;cur=`${y}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;const o=out.get(cur)||{msgs:0,files:0};o.msgs++;out.set(cur,o)}
    if(cur&&/\.(jpe?g|png|webp|gif|pdf|mp4|mov)\b/i.test(t))out.get(cur).files++}
  return out;
}

async function waStart(file,date){
  const ex0=await getDoc('days/'+date);
  if(!ex0){const wd=gd(date).getDay();S.day={date,wd,label:hijri(date),sessions:[]};S.dayDate=date;await saveDay()}
  else{S.day=ex0;S.dayDate=date}
  if(IMP.result&&IMP.result.length&&IMP.forDay===date){IMP.files.push(file);IMP.text=IMP.text||''}else IMP={files:[file],items:[],log:'',busy:false,result:null,text:''};IMP.forDay=date;S.dayTab='import';
  await new Promise(ok=>{openDay(date);setTimeout(ok,600)});
  if(S.day&&S.day.date===date){renderDayMain();runImport(S.day)}
}

async function waBatchImport(file,dates){
  const results=[],failed=[];const sorted=[...new Set(dates)].sort();
  for(let i=0;i<sorted.length;i++){
    const date=sorted[i];
    const existing=await getDoc('days/'+date);
    const day=existing||{date,wd:gd(date).getDay(),label:hijri(date),sessions:[]};
    S.day=day;S.dayDate=date;IMP={files:[file],items:[],log:'',busy:false,result:null,text:'',forDay:date};S.dayTab='import';
    renderDayMain();
    try{await runImport(day);
      if(PG.bad||!IMP.result?.length){failed.push({date,reason:'لم يستخرج كشفًا صالحًا'});continue}
      const sessions=IMP.result.filter(x=>x.keep&&x.s&&x.s.g&&x.s.c&&x.s.p).map(x=>structuredClone(x.s));
      if(sessions.length)results.push({date,sessions,exists:!!existing});else failed.push({date,reason:'لا توجد كشوف للمراجعة'});
    }catch(err){failed.push({date,reason:String(err.message||err)})}
  }
  const m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="card stack" style="max-width:660px"><h2>مراجعة استيراد عدة أيام</h2><div class="muted small">لن تُحفظ أي بيانات حتى تضغط اعتماد وحفظ. سيتم دمج أسماء الكشوف المتكررة دون حذف الحضور السابق.</div>
  <div class="daylist">${results.map(x=>`<label class="dayitem"><input type="checkbox" data-batch-save value="${x.date}" checked><span>${esc(hijri(x.date))} — ${x.exists?'إضافة إلى يوم موجود':'إنشاء يوم جديد'}</span><b>${toAr(x.sessions.length)} كشف</b></label>`).join('')||'<div class="notice">لا توجد نتائج صالحة للحفظ.</div>'}</div>
  ${failed.length?`<div class="notice">أيام لم تُحلل (لن يتم حفظها): ${failed.map(x=>esc(hijri(x.date))).join('، ')}</div>`:''}
  <div class="row"><button class="btn primary" id="batchSave" ${results.length?'':'disabled'}>اعتماد وحفظ الأيام المحددة</button><button class="btn" id="batchCancel">إغلاق دون حفظ</button></div><div id="batchStatus" class="muted"></div></div>`;
  m.onclick=async e=>{
    if(e.target.id==='batchCancel'){m.hidden=true;return}
    if(e.target.id!=='batchSave')return;
    const button=e.target;button.disabled=true;let created=0,updated=0,count=0;const errors=[];
    for(const x of results.filter(x=>m.querySelector('[data-batch-save][value="'+x.date+'"]')?.checked)){
      try{
       const old=await getDoc('days/'+x.date),day=old||{date:x.date,wd:gd(x.date).getDay(),label:hijri(x.date),sessions:[]};
       for(const incoming of x.sessions){const k=skey(incoming),target=day.sessions.find(y=>skey(y)===k);
        if(target){target.m=mergeNames(target.m||[],incoming.m||[]);if(!target.s)target.s=incoming.s||'';if(!target.t)target.t=incoming.t||'';if(incoming.note&&!String(target.note||'').includes(incoming.note))target.note=[target.note,incoming.note].filter(Boolean).join(' — ')}
        else day.sessions.push(incoming);count++;
       }
       day.updatedAt=new Date().toISOString();
       if(!await setDoc('days/'+x.date,day))throw Error('تعذر حفظ اليوم');
       const idx=S.index.find(d=>d.date===x.date);
       if(idx)idx.count=day.sessions.length;else S.index.push({date:x.date,label:day.label,wd:day.wd,count:day.sessions.length});
       if(old)updated++;else created++;
      }catch(err){errors.push(hijri(x.date)+': '+String(err.message||err))}
    }
    try{if(!await saveIndex())errors.push('تعذر حفظ فهرس الأيام')}catch(err){errors.push('فهرس الأيام: '+err.message)}
    $('#batchStatus').textContent='أُنشئ '+toAr(created)+' يوم، وحُدّث '+toAr(updated)+' يوم، وأُضيف '+toAr(count)+' كشف. '+(errors.length?'أخطاء: '+errors.join('؛ '):'تم الحفظ.');
    if(!errors.length){S.dayDate=null;toast('تم حفظ التواريخ المحددة بنجاح',5000)}
    else button.disabled=false;
  };
}

const PG={pct:0,label:'',t0:0,timer:null,goal:0};
function progSet(pct,label){PG.pct=Math.max(PG.pct,Math.min(100,pct));if(label)PG.label=label;progDraw()}
function progDraw(){const el=$('#iprog');if(!el)return;el.hidden=!IMP.busy&&!PG.label;el.classList.toggle('bad',!!PG.bad);
  $('#ipbar').style.width=PG.pct.toFixed(1)+'%';$('#ippct').textContent=toAr(Math.round(PG.pct))+'٪';$('#iplab').textContent=PG.label;
  const s=Math.round((Date.now()-PG.t0)/1000);$('#iptime').textContent=PG.t0?`الوقت المنقضي ${toAr(Math.floor(s/60))}:${toAr(String(s%60).padStart(2,'0'))}`:''}
function progStart(){PG.bad=false;PG.pct=0;PG.label='جارٍ التحضير…';PG.t0=Date.now();clearInterval(PG.timer);PG.timer=setInterval(()=>{if(PG.goal>PG.pct){PG.pct+=Math.max(.05,(PG.goal-PG.pct)*.012)}progDraw()},500);progDraw()}
function progCreep(to){PG.goal=to}
function progEnd(label,bad){clearInterval(PG.timer);PG.goal=0;PG.bad=!!bad;if(!bad)PG.pct=100;PG.label=label;progDraw()}

/* ---------- speed: dedupe + pair tiling + parallel batches ---------- */
async function bmpOf(blob){return await createImageBitmap(blob)}
async function ahash(bmp){const c=document.createElement('canvas');c.width=16;c.height=16;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(bmp,0,0,16,16);const d=g.getImageData(0,0,16,16).data;const v=[];for(let i=0;i<d.length;i+=4)v.push((d[i]+d[i+1]+d[i+2])/3);const m=v.reduce((a,b)=>a+b,0)/v.length;return v.map(x=>x>m?1:0)}
const ham=(a,b)=>{let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])n++;return n};
async function optimizeImages(imgs){
  // exact duplicates only (same bytes). Similar-looking Teams lists are NOT merged or dropped.
  const out=[],seen=new Set();let dup=0;
  for(const im of imgs){try{const h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-1',await im.blob.arrayBuffer()))).join(',');if(seen.has(h)){dup++;continue}seen.add(h)}catch{}out.push(im)}

function renderReports(app){
  app.innerHTML=`<div class="card stack"><h2>تقارير عدة أيام</h2>
   <div class="row">${(()=>{const ds=S.index.slice().sort((x,y)=>x.date.localeCompare(y.date));const opt=v=>ds.map(d=>`<option value="${d.date}" ${d.date===v?'selected':''}>${esc(hijri(d.date))}</option>`).join('');
   return`<label>من <select id="rf"><option value="">أول يوم</option>${opt(S.rep.from)}</select></label><label>إلى <select id="rt"><option value="">آخر يوم</option>${opt(S.rep.to)}</select></label>`})()}
   <select id="rk"><option value="stu">الطلاب: أيام عدم الحضور</option><option value="tch">المعلمون: الكشوف غير المرسلة</option><option value="cls">الفصول: نسبة الحضور</option></select>
   <button class="btn primary" id="rgo">عرض التقرير</button><span class="muted small" id="rhint"></span><button class="btn" id="rx" hidden>تصدير</button>
   <input type="search" id="rsearch" placeholder="بحث عن طالب أو معلم"></div>
   <div id="rout"><div class="empty">اختر الفترة ونوع التقرير.</div></div></div>`;
  let rows=null,head=null;
  const draw=()=>{const q=norm($('#rsearch').value);const r=q.length?rows.filter(x=>q.every(t=>norm(x.join(' ')).some(y=>y.includes(t)))):rows;
    $('#rout').innerHTML=`<div class="muted small" style="margin:6px 0">${toAr(r.length)} صفًا</div><div class="tbl"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${r.slice(0,600).map(x=>`<tr>${x.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};
  $('#rsearch').oninput=()=>rows&&draw();
  $('#rgo').onclick=async()=>{S.rep.from=$('#rf').value;S.rep.to=$('#rt').value;$('#rout').innerHTML='<div class="empty">جارٍ التحميل…</div>';
    const days=await loadDays(S.rep.from,S.rep.to);if(!days.length){$('#rout').innerHTML='<div class="empty">لا توجد أيام في هذه الفترة.</div>';return}
    const k=$('#rk').value;
    if(k==='stu'){const agg=new Map();for(const d of days){for(const a of dayAbsence(d)){const o=agg.get(a.r.i)||{r:a.r,never:0,miss:0,dates:[]};if(a.never){o.never++;o.dates.push(hijri(d.date,true))}o.miss+=a.miss.length;agg.set(a.r.i,o)}}
      head=['الطالب','الصف','الفصل','السجل','الجوال','أيام لم يحضر فيها أي حصة','مجموع الحصص الغائب عنها','الأيام'];
      rows=[...agg.values()].sort((a,b)=>b.never-a.never||b.miss-a.miss).map(o=>[o.r.n,GN[o.r.g],o.r.c,o.r.i,o.r.p||'',o.never,o.miss,o.dates.join('، ')])}
    if(k==='tch'){const agg=new Map();for(const d of days){const exp=expected(d.wd);for(const e of exp){const o=agg.get(e.t)||{t:e.t,exp:0,miss:0};o.exp++;agg.set(e.t,o)}for(const e of missingTeachers(d))agg.get(e.t).miss++}
      head=['المعلم','الحصص في الجدول','الكشوف غير المرسلة','نسبة الإرسال'];rows=[...agg.values()].sort((a,b)=>b.miss-a.miss).map(o=>[o.t,o.exp,o.miss,Math.round(100*(o.exp-o.miss)/Math.max(o.exp,1))+'%'])}
    if(k==='cls'){const agg=new Map();for(const d of days){for(const s of d.sessions){if(s.partial)continue;const key=s.g+s.c;const size=S.roster.filter(r=>r.g==s.g&&r.c===s.c).length;const o=agg.get(key)||{g:s.g,c:s.c,n:0,pres:0,size};o.n++;o.pres+=s.m.filter(x=>x.i).length;agg.set(key,o)}}
      head=['الصف','الفصل','عدد الكشوف','متوسط الحاضرين','عدد طلاب الفصل','نسبة الحضور'];rows=[...agg.values()].sort((a,b)=>a.g-b.g||CL.indexOf(a.c)-CL.indexOf(b.c)).map(o=>[GN[o.g],o.c,o.n,Math.round(o.pres/o.n),o.size,Math.round(100*o.pres/o.n/Math.max(o.size,1))+'%'])}
    $('#rx').hidden=false;const ttl={stu:'تقرير غياب الطلاب',tch:'تقرير إرسال كشوف المعلمين',cls:'تقرير الحضور حسب الفصول'}[k];const per=`${hijri(days[0].date,true)} — ${hijri(days[days.length-1].date,true)}`;
      $('#rx').onclick=()=>exportMenu(()=>({title:ttl,sub:per,file:`${ttl} ${per}`.replace(/\s+/g,'_'),meta:[['الفترة',per],['عدد الأيام',days.length]],blocks:[{h:ttl,cols:head.map((h,i)=>({t:h,w:i===0?2.5:i===head.length-1&&k==='stu'?3:1.1,c:i>0}) ),rows}],notes:[]}));draw()};
}

/* ---------- students ---------- */
async function allDays(){if(!S.allDays){S.allDays=await loadDays();S.stuStats=null}return S.allDays}
function studentStats(){if(S.stuStats)return S.stuStats;const st=new Map();const days=S.allDays||[];
  for(const d of days){const att=new Map();for(const s of d.sessions)for(const x of s.m)if(x.i){if(!att.has(x.i))att.set(x.i,new Set());att.get(x.i).add(s.p)}
    const cls=new Map();for(const s of d.sessions){if(s.partial)continue;const k=s.g+'|'+s.c;if(!cls.has(k))cls.set(k,new Set());cls.get(k).add(s.p)}
    for(const r of S.roster){const ps=cls.get(r.g+'|'+r.c),a=att.get(r.i);if(!ps&&!a)continue;const o=st.get(r.i)||{pres:0,abs:0,part:0,missS:0};
      if(a){o.pres++;const m=ps?[...ps].filter(p=>!a.has(p)).length:0;if(m){o.part++;o.missS+=m}}else{o.abs++;o.missS+=ps.size}st.set(r.i,o)}}
  S.stuStats=st;return st}
function renderStudents(app){
  if(!S.allDays){app.innerHTML='<div class="empty">جارٍ حساب الحضور والغياب لكل طالب…</div>';allDays().then(()=>{if(S.view==='students')renderStudents(app)});return}
  const stats=studentStats();
  const f=S.stuFilter;const q=norm(f.q);
  let list=S.roster.filter(r=>(!f.g||r.g==f.g)&&(!f.c||r.c===f.c)&&(!q.length||q.every(t=>r._t.some(x=>x.includes(t)))||r.i.includes(f.q)||(r.p||'').includes(f.q)));
  const z={pres:0,abs:0,part:0,missS:0};const SO=f.sort||'name';
  list.sort(SO==='abs'?(a,b)=>((stats.get(b.i)||z).abs-(stats.get(a.i)||z).abs)||((stats.get(b.i)||z).missS-(stats.get(a.i)||z).missS):SO==='pres'?(a,b)=>((stats.get(b.i)||z).pres-(stats.get(a.i)||z).pres):(a,b)=>a.g-b.g||CL.indexOf(a.c)-CL.indexOf(b.c)||a.n.localeCompare(b.n,'ar'));
  const per=100,pages=Math.max(1,Math.ceil(list.length/per));S.stuPage=Math.min(S.stuPage,pages-1);
  const sizes={};S.roster.forEach(r=>{const k=r.g+(r.c||'؟');sizes[k]=(sizes[k]||0)+1});
  app.innerHTML=`<div class="card stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">الطلاب (${toAr(S.roster.length)})</h2>
   <div class="row"><button class="btn" id="sadd">إضافة طالب</button><button class="btn" id="simp">استيراد Excel</button><input type="file" id="sfile" accept=".xlsx,.xls,.csv" hidden><button class="btn" id="sx">تصدير</button></div></div>
   <div class="row"><input type="search" id="sq" placeholder="بحث بالاسم أو السجل أو الجوال" value="${esc(f.q)}" class="flex1">
   <select id="sg"><option value="">كل الصفوف</option>${[1,2,3].map(g=>`<option value="${g}" ${f.g==g?'selected':''}>${GN[g]}</option>`).join('')}</select>
   <select id="sc"><option value="">كل الفصول</option>${CL.map(c=>`<option ${f.c===c?'selected':''}>${c}</option>`).join('')}<option value="" disabled>—</option></select>
   <select id="ssort"><option value="name" ${SO==='name'?'selected':''}>ترتيب: الفصل والاسم</option><option value="abs" ${SO==='abs'?'selected':''}>الأكثر غيابًا</option><option value="pres" ${SO==='pres'?'selected':''}>الأكثر حضورًا</option></select>
   <button class="btn small" id="srefresh" title="إعادة حساب الحضور من كل الأيام">تحديث الإحصائية</button></div>
   <div class="muted small">الإحصائية من ${toAr((S.allDays||[]).length)} يوم مسجّل: «حضر» = أيام حضر فيها حصة على الأقل، «غاب» = أيام لم يحضر فيها أي حصة. اضغط عليها للتفاصيل.</div>
   <div class="row small muted">${Object.entries(sizes).sort().map(([k,v])=>`<span class="pill mut">${GN[k[0]]} ${k.slice(1)}: ${toAr(v)}</span>`).join(' ')}</div>
   <div class="tbl"><table><thead><tr><th>الاسم</th><th>الصف</th><th>الفصل</th><th class="num">السجل المدني</th><th class="num">الجوال</th><th class="num">الحضور والغياب</th><th></th></tr></thead><tbody>
   ${list.slice(S.stuPage*per,(S.stuPage+1)*per).map(r=>`<tr><td>${esc(r.n)}</td><td>${GN[r.g]||r.g}</td><td>${esc(r.c||'—')}</td><td class="num k">${esc(r.i)}</td><td class="num k">${esc(r.p||'—')}</td><td class="num">${(()=>{const o=stats.get(r.i)||z;return`<button class="btn small" data-h="${r.i}" title="عرض التفاصيل" style="padding:2px 6px"><span class="pill ok">حضر ${toAr(o.pres)}</span> <span class="pill bad">غاب ${toAr(o.abs)}</span>${o.part?` <span class="pill warn">جزئي ${toAr(o.part)}</span>`:''}</button>`})()}</td><td><button class="btn small" data-e="${r.i}">تعديل</button></td></tr>`).join('')}
   </tbody></table></div>
   <div class="row">${pages>1?Array.from({length:pages},(_,i)=>`<button class="btn small" data-pg="${i}" ${i===S.stuPage?'disabled':''}>${toAr(i+1)}</button>`).join(''):''}<span class="muted small">${toAr(list.length)} نتيجة</span></div>
   </div>`;
  $('#sq').oninput=e=>{f.q=e.target.value;S.stuPage=0;clearTimeout(renderStudents._t);renderStudents._t=setTimeout(()=>{renderStudents(app);const i=$('#sq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)};
  $('#ssort').onchange=e=>{f.sort=e.target.value;S.stuPage=0;renderStudents(app)};
  $('#srefresh').onclick=()=>{S.allDays=null;S.stuStats=null;renderStudents(app)};
  $('#sg').onchange=e=>{f.g=e.target.value;S.stuPage=0;renderStudents(app)};$('#sc').onchange=e=>{f.c=e.target.value;S.stuPage=0;renderStudents(app)};
  $('#sx').onclick=()=>exportMenu(()=>({title:'قائمة الطلاب',sub:f.g||f.c?`${f.g?GN[f.g]+' الثانوي':''} ${f.c?'('+f.c+')':''}`:'كل الطلاب',file:'قائمة_الطلاب',meta:[['العدد',list.length]],blocks:[{h:'الطلاب',cols:[{t:'م',w:.5,c:1},{t:'الاسم',w:3.5},{t:'الصف',w:1,c:1},{t:'الفصل',w:.7,c:1},{t:'السجل المدني',w:1.5,c:1},{t:'الجوال',w:1.5,c:1}],rows:list.map((r,i)=>[i+1,r.n,GN[r.g],r.c,r.i,r.p||''])}]}));
  $('#sadd').onclick=()=>editStudent(null);
  $('#simp').onclick=()=>$('#sfile').click();$('#sfile').onchange=e=>importRoster(e.target.files[0]);
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.e)editStudent(S.byId.get(b.dataset.e));if(b.dataset.pg){S.stuPage=+b.dataset.pg;renderStudents(app)}if(b.dataset.h)studentHistory(S.byId.get(b.dataset.h))};
}
async function studentHistory(r){const m=$('#modal');m.hidden=false;m.innerHTML='<div class="card"><div class="empty">جارٍ تحميل سجل الطالب…</div></div>';const mdl=await studentModel(r);
  m.innerHTML=`<div class="card stack"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${esc(r.n)}</h2><div class="muted small">${GN[r.g]} الثانوي (${esc(r.c||'—')}) · السجل <span class="k">${esc(r.i)}</span> · الجوال <span class="k">${esc(r.p||'—')}</span></div></div>
   <div class="row"><button class="btn primary small" data-x="pdf">حفظ PDF</button><button class="btn primary small" data-x="docx">حفظ Word</button><button class="btn small" data-x="xlsx">Excel</button><button class="btn small" data-x="close">إغلاق</button></div></div>
  <div id="hst" class="muted small"></div>
  <div class="tiles">${mdl.meta.slice(4).map(([k,v],i)=>`<div class="tile ${i===1?'warn':i===2?'bad':i===0?'ok':''}"><b>${toAr(v)}</b><span>${esc(k)}</span></div>`).join('')}</div>
  <div class="tbl"><table><thead><tr><th>اليوم</th><th>حضر</th><th>غاب</th><th>الحالة</th></tr></thead><tbody>${mdl._rows.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${x[3]==='حاضر'?'<span class="pill ok">حاضر</span>':x[3]==='لم يحضر أي حصة'?'<span class="pill bad">لم يحضر</span>':`<span class="pill warn">${esc(x[3])}</span>`}</td></tr>`).join('')||'<tr><td colspan="4">لا توجد أيام مسجّلة</td></tr>'}</tbody></table></div></div>`;
  m.onclick=async e=>{const b=e.target.closest('[data-x]');if(!b)return;const f=b.dataset.x;if(f==='close'){m.hidden=true;return}
    m.querySelectorAll('[data-x]').forEach(x=>x.disabled=true);await doExport(()=>mdl,f,$('#hst'));m.querySelectorAll('[data-x]').forEach(x=>x.disabled=false)}}
function editStudent(r){const m=$('#modal');m.hidden=false;const w=r?{...r}:{i:'',n:'',g:1,c:'أ',p:''};
  m.innerHTML=`<div class="card stack" style="max-width:520px"><h2>${r?'تعديل طالب':'طالب جديد'}</h2>
  <label>الاسم <input type="text" id="tn" value="${esc(w.n)}" style="width:100%"></label>
  <div class="row"><label>السجل المدني <input type="text" id="ti" value="${esc(w.i)}" ${r?'disabled':''}></label><label>الجوال <input type="text" id="tp" value="${esc(w.p||'')}"></label></div>
  <div class="row"><label>الصف <select id="tg">${[1,2,3].map(g=>`<option value="${g}" ${w.g==g?'selected':''}>${GN[g]}</option>`).join('')}</select></label><label>الفصل <select id="tc">${CL.map(c=>`<option ${w.c===c?'selected':''}>${c}</option>`).join('')}</select></label></div>
  <div class="row" style="justify-content:space-between">${r?'<button class="btn danger" id="tdel">حذف الطالب</button>':'<span></span>'}<div class="row"><button class="btn" id="tx">إلغاء</button><button class="btn primary" id="ts">حفظ</button></div></div></div>`;
  m.onclick=async e=>{const id=e.target.id;if(id==='tx'){m.hidden=true}
    if(id==='tdel'){S.roster=S.roster.filter(x=>x.i!==r.i);setRoster(S.roster);await saveRoster();m.hidden=true;render();toast('حُذف الطالب')}
    if(id==='ts'){const nw={i:r?r.i:$('#ti').value.trim(),n:$('#tn').value.trim(),g:+$('#tg').value,c:$('#tc').value,p:$('#tp').value.trim()};
      if(!nw.i||!nw.n){toast('الاسم والسجل المدني مطلوبان');return}if(!r&&S.byId.has(nw.i)){toast('هذا السجل موجود');return}
      const list=S.roster.map(({_t,...x})=>x).filter(x=>x.i!==nw.i);list.push(nw);setRoster(list);await saveRoster();m.hidden=true;render();toast('حُفظ')}}}
async function importRoster(file){if(!file)return;await lib('xlsx');const wb=XLSX.read(await file.arrayBuffer());let add=0,upd=0;const list=S.roster.map(({_t,...x})=>x);const by=new Map(list.map(x=>[x.i,x]));
  for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false});let hdr=null,cols={},grade=null,cls=null;
    for(const row of rows){const cells=row.map(v=>String(v??'').trim());
      const gi=cells.indexOf('الصف'),ci=cells.indexOf('الفصل');
      if(!hdr&&cells.some(v=>v==='اسم الطالب')){hdr=cells;cells.forEach((v,i)=>{if(v==='اسم الطالب')cols.n=i;if(/السجل|رقم الهوية|رقم رخصة|هوية/.test(v))cols.i=i;if(/جوال/.test(v))cols.p=i;if(v==='الفصل')cols.c=i;if(v==='الصف')cols.g=i});continue}
      if(!hdr){const gv=cells.find(v=>/الأول|الثاني|الثالث/.test(v)&&/ثانوي/.test(v));if(gv)grade=/الأول/.test(gv)?1:/الثاني/.test(gv)?2:3;continue}
      const n=cells[cols.n],i=cells[cols.i];if(!n||!i||!/\d{6,}/.test(i))continue;
      let c=cells[cols.c]||'';if(/^\d$/.test(c))c=CL[+c-1]||c;let g=grade;const gv=cells[cols.g]||'';if(/الأول|1/.test(gv))g=1;else if(/الثاني|2/.test(gv))g=2;else if(/الثالث|3/.test(gv))g=3;
      let p=(cells[cols.p]||'').replace(/\D/g,'');if(p.startsWith('966'))p='0'+p.slice(3);
      const o=by.get(i);if(o){if(p)o.p=p;o.n=n;upd++}else{const x={i,n,g:g||1,c,p};list.push(x);by.set(i,x);add++}}}
  setRoster(list);await saveRoster();render();toast(`أُضيف ${toAr(add)} وحُدّث ${toAr(upd)} طالبًا. الفصل لا يتغيّر للطلاب الموجودين.`,5000)}

function editCell(t,p,wd){const e=S.tt.find(x=>x.t===t&&x.d===wd&&x.p===p)||{};const m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="card stack" style="max-width:460px"><h2>${esc(t)} — ${WD[wd]} الحصة ${PN[p]}</h2>
  <label>النوع <select id="ck"><option value="none">لا حصة</option><option value="w" ${e.w?'selected':''}>انتظار</option><option value="s" ${e.s?'selected':''}>حصة</option></select></label>
  <label>المادة <input type="text" id="cs" value="${esc(e.s||'')}"></label>
  <div class="row"><label>الصف <select id="cg">${[1,2,3].map(g=>`<option value="${g}" ${e.g==g?'selected':''}>${GN[g]}</option>`).join('')}</select></label><label>الفصل <select id="cc">${CL.map(c=>`<option ${e.c===c?'selected':''}>${c}</option>`).join('')}</select></label></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="cx">إلغاء</button><button class="btn primary" id="cv">حفظ</button></div></div>`;
  m.onclick=async ev=>{if(ev.target.id==='cx')m.hidden=true;if(ev.target.id==='cv'){S.tt=S.tt.filter(x=>!(x.t===t&&x.d===wd&&x.p===p));const k=$('#ck').value;
    if(k==='w')S.tt.push({t,d:wd,p,w:1});if(k==='s')S.tt.push({t,d:wd,p,s:$('#cs').value.trim(),g:+$('#cg').value,c:$('#cc').value});await saveTT();m.hidden=true;render()}}}

  ${STANDALONE?`<div class="stack" style="gap:6px"><b>مفتاح Claude API (للتحليل الآلي للصور والملفات)</b><div class="muted small">يُحفظ في هذا المتصفح فقط ويُرسل مباشرة إلى Anthropic. احصل عليه من console.anthropic.com. بدونه تعمل كل الميزات ما عدا التحليل الآلي.</div>
   <div class="row"><input type="password" id="akey" class="flex1" placeholder="sk-ant-..." value="${esc(getKey())}"><input type="text" id="amodel" placeholder="النموذج" value="${esc((()=>{try{return localStorage.getItem('hudoor_model')||'claude-sonnet-5-5'}catch{return'claude-sonnet-5-5'}})())}"><button class="btn" id="asave">حفظ</button></div></div>`:''}
  <div><b>طريقة الحساب</b><ul class="small muted">
   <li>الغائب في حصة: طالب من الفصل لم يظهر في كشف تلك الحصة ولا في كشف أي فصل آخر في نفس الحصة.</li>

/* ---------- standalone mode (outside Claude): local storage, file saving, optional API key ---------- */
const STANDALONE=!window.claude;
function localDb(){
  let dbp=null;const open=()=>dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open('hudoor',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
  const tx=async(mode,fn)=>{const d=await open();return new Promise((ok,no)=>{const t=d.transaction('docs',mode);const st=t.objectStore('docs');const r=fn(st);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})};
  const subs=new Map();const snap=(id,v)=>({id,exists:v!=null,data:()=>v==null?undefined:v,metadata:{fromCache:false,hasPendingWrites:false}});
  const fire=(p,v)=>(subs.get(p)||[]).forEach(f=>f(snap(p.split('/').pop(),v)));
  const api={doc(p){return{id:p.split('/').pop(),path:p,
      async get(){const v=await tx('readonly',st=>st.get(p));return snap(p.split('/').pop(),v??null)},
      async set(v){const c=JSON.parse(JSON.stringify(v));await tx('readwrite',st=>st.put(c,p));fire(p,c)},
      async update(v){const o=(await tx('readonly',st=>st.get(p)))||{};const c={...o,...JSON.parse(JSON.stringify(v))};await tx('readwrite',st=>st.put(c,p));fire(p,c)},
      async delete(){await tx('readwrite',st=>st.delete(p));fire(p,null)},
      onSnapshot(next){if(!subs.has(p))subs.set(p,[]);subs.get(p).push(next);tx('readonly',st=>st.get(p)).then(v=>next(snap(p.split('/').pop(),v??null)));return()=>subs.set(p,(subs.get(p)||[]).filter(f=>f!==next))}}},
    async all(){const d=await open();return new Promise((ok,no)=>{const out={};const t=d.transaction('docs','readonly');const c=t.objectStore('docs').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else ok(out)};c.onerror=()=>no(c.error)})},
    async clear(){await tx('readwrite',st=>st.clear())}};
  return api;
}
const localDownloads={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000);return{status:'saved'}}};
function getKey(){try{return localStorage.getItem('hudoor_key')||''}catch{return''}}
function apiSample(){
  const call=async(prompt,opts={})=>{const key=getKey();if(!key)throw{code:'not_granted',message:'أدخل مفتاح Claude API من الإعدادات'};
    const content=[];for(const b of (opts.images?[].concat(opts.images):[])){const buf=new Uint8Array(await b.arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=32768)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));content.push({type:'image',source:{type:'base64',media_type:b.type||'image/jpeg',data:btoa(bin)}})}
    content.push({type:'text',text:prompt});
    let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:(opts.modelTier==='quick'?'claude-haiku-5-5':(localStorage.getItem('hudoor_model')||'claude-sonnet-5-5')),max_tokens:16000,messages:[{role:'user',content}]})})}
    catch(e){if(e.name==='AbortError')throw{code:'cancelled'};throw{code:'upstream_error',message:'تعذّر الاتصال بـ Claude'}}
    const j=await r.json().catch(()=>({}));if(!r.ok){throw{code:r.status===429?'rate_limited':r.status===401?'not_granted':'upstream_error',message:(j.error&&j.error.message)||('HTTP '+r.status)}}
    return(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('')};
  const f=async(p,o)=>({text:await call(p,o),truncated:false});
  f.json=async(p,o)=>{const t=await call(p+'\n\nأعد JSON فقط.',o);const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);const raw=m?m[1]:t.slice(t.search(/[\[{]/),Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'))+1);try{return JSON.parse(raw)}catch{throw{code:'invalid_json',text:t}}};
  f.limits=async()=>({maxPromptBytes:262144,images:{maxCount:20,maxInputBytes:20e6,mediaTypes:['image/jpeg','image/png','image/webp','image/gif']}});
  return f;
}
async function backupExport(){const all=STANDALONE?await S.db.all():null;let data=all;
  if(!data){data={'app/roster':{students:S.roster.map(({_t,...r})=>r)},'app/timetable':{entries:S.tt},'app/settings':S.settings,'app/index':{days:S.index}};for(const d of S.index){const x=await getDoc('days/'+d.date);if(x)data['days/'+d.date]=x}}
  const blob=new Blob([JSON.stringify({app:'hudoor',version:1,exportedAt:new Date().toISOString(),docs:data})],{type:'application/json'});
  try{await (S.downloads||localDownloads).save({filename:`نسخة_احتياطية_الحضور_${new Date().toISOString().slice(0,10)}.json`,data:blob});toast('جاهز للحفظ')}catch(e){if(e&&e.code!=='declined')toast('تعذّر الحفظ')}}
async function backupImport(file){try{const j=JSON.parse(await file.text());if(!j.docs)throw 0;for(const [p,v] of Object.entries(j.docs))await S.db.doc(p).set(v);toast('تم استيراد النسخة الاحتياطية');S.allDays=null;S.dayDate=null}catch{toast('الملف ليس نسخة احتياطية صحيحة')}}
window.addEventListener('message',async function(event){
 if(event.origin!==location.origin || event.data?.type!=='shurahbil-import-madrasati')return;
 try{
  const docs=event.data?.payload?.docs;
  if(!docs || !docs['app/roster'] || !docs['app/timetable'])throw Error('بيانات النسخة غير مكتملة');
  if(!S.db)throw Error('لم تكتمل تهيئة قاعدة بيانات التحضير');
  for(const [path,record] of Object.entries(docs)) await S.db.doc(path).set(record);
  S.allDays=null;S.dayDate=null;
  window.parent.postMessage({type:'shurahbil-madrasati-import-result',ok:true,students:docs['app/roster']?.students?.length||0,days:Object.keys(docs).filter(k=>k.startsWith('days/')).length},location.origin);
  location.reload();
 }catch(error){
  window.parent.postMessage({type:'shurahbil-madrasati-import-result',ok:false,error:String(error.message||error)},location.origin);
 }
});
document.getElementById('sh-local-backup')?.addEventListener('change',async function(){
 const file=this.files?.[0], msg=document.getElementById('sh-import-state'); if(!file)return;
 try{
  msg.textContent='جارٍ قراءة ملف البيانات...';
  const obj=JSON.parse(await file.text()), docs=obj.docs;
  if(!docs || !Array.isArray(docs['app/roster']?.students) || !Array.isArray(docs['app/timetable']?.entries) || !Array.isArray(docs['app/index']?.days))throw Error('ملف البيانات لا يحتوي على النسخة الاحتياطية المطلوبة');
  if(!S.db)throw Error('قاعدة بيانات التحضير لم تصبح جاهزة');
  for(const [path,value] of Object.entries(docs)) await S.db.doc(path).set(value);
  const check=await S.db.doc('app/roster').get();
  if(!check.exists || check.data().students.length!==docs['app/roster'].students.length)throw Error('لم يتم التحقق من حفظ سجلات الطلاب');
  document.getElementById('sh-empty-import-notice')?.remove();
  msg.textContent='✓ تم استيراد '+check.data().students.length+' طالب و '+docs['app/timetable'].entries.length+' مدخل جدول و '+docs['app/index'].days.length+' أيام بنجاح';
  this.value='';
  setTimeout(()=>location.reload(),700);
 }catch(err){msg.textContent='تعذر الاستيراد: '+(err?.message||err);this.value=''}
});

(async function boot(){
  let db,sample,downloads;
  if(STANDALONE){db=localDb();sample=apiSample();downloads=localDownloads}
  else [db,sample,downloads]=await Promise.all([claude.use('db'),claude.use('sample'),claude.use('downloads')]);
  S.db=db;S.sample=sample;S.downloads=downloads;
  if(!db){render();return}
  db.doc('app/roster').onSnapshot(sn=>{setRoster(sn.exists?(sn.data().students||[]):[]);if(S.view==='students')render();else if(S.day&&!S.editing)renderDayMain()},()=>{});
  db.doc('app/timetable').onSnapshot(sn=>{S.tt=sn.exists?structuredClone(sn.data().entries||[]):[];{const RX=/اختياري|نشاط/,n=S.tt.length;S.tt=S.tt.filter(e=>!RX.test(e.s||''));if(S.tt.length<n)db.doc('app/timetable').set({entries:S.tt}).catch(()=>{})}if(S.view==='tt'&&$('#modal').hidden)render();else if(S.day&&!S.editing)renderDayMain()},()=>{});
  db.doc('app/settings').onSnapshot(sn=>{S.settings=sn.exists?structuredClone(sn.data()):{aliases:[]}},()=>{});
  db.doc('app/index').onSnapshot(sn=>{S.allDays=null;S.stuStats=null;S.index=sn.exists?structuredClone(sn.data().days||[]):[];if(S.view==='day'&&!S.editing){render()}if(!S.dayDate&&S.index.length){const last=S.index.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];openDay(last.date)}},()=>{});
  render();
  if(STANDALONE){
   const snap=await S.db.doc('app/roster').get();
   if(!snap.exists || !(snap.data()?.students||[]).length){
     document.getElementById('sh-import-state').textContent='⚠️ لا توجد بيانات محفوظة على هذا المتصفح — يلزم اختيار ملف النسخة الاحتياطية مرة واحدة';
     const notice=document.createElement('div');notice.id='sh-empty-import-notice';
     notice.style.cssText='position:fixed;bottom:18px;right:18px;left:18px;z-index:99998;background:#fff8e7;color:#53370b;border:2px solid #e3b34e;border-radius:14px;padding:18px;box-shadow:0 10px 30px #0003;direction:rtl;font:700 16px Tahoma,Arial;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap';
     notice.innerHTML='<span>لا توجد بيانات طلاب في هذا المتصفح. استورد ملف «بيانات تحضير منصة مدرستي.json» لتظهر الأسماء والجداول.</span><button id="sh-empty-upload" type="button" style="border:0;border-radius:10px;background:#087866;color:white;padding:12px 18px;font-weight:800;cursor:pointer">📂 اختيار ملف بيانات الطلاب</button>';
     document.body.appendChild(notice);
     notice.querySelector('#sh-empty-upload').onclick=()=>document.getElementById('sh-local-backup')?.click();
   }
  }
})();
