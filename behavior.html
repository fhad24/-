<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>الحالات السلوكية</title>
<style>
:root{--nav:#1d1e33;--nav2:#242641;--purple:#5a5cc8;--blue:#475fe9;--bg:#f4f6fb;--card:#fff;--line:#e1e5ef;--text:#1f2540;--muted:#737b94;--danger:#ee1d2f;--green:#0f8c68}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font-family:inherit}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:linear-gradient(180deg,var(--nav),#20223a);color:#fff;padding:16px 12px;overflow:auto}
.brand{height:72px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;color:#177f7b;font-size:24px;font-weight:900;margin:0 10px 20px}
.sideBtn{width:100%;border:0;background:transparent;color:#c9cbe0;border-radius:12px;padding:14px 16px;margin:5px 0;text-align:right;font-size:17px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.sideBtn:hover,.sideBtn.active{background:#2c2e4f;color:#fff}.sideBtn .dot{width:9px;height:9px;border-radius:2px;background:#55598d;box-shadow:13px 0 #55598d,0 13px #55598d,13px 13px #55598d;margin-left:16px}.sideBtn.active .dot{background:#8589ff;box-shadow:13px 0 #8589ff,0 13px #8589ff,13px 13px #8589ff}.back{margin-top:25px;border:1px solid #515574}
.main{padding:14px 18px 34px;overflow:auto}.panel{background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 2px 10px #1f25400a;overflow:hidden}
.panelTitle{padding:25px 28px;font-size:21px;border-bottom:1px solid var(--line);color:#30354f}
.formArea{padding:34px 38px 28px}.formGrid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:28px 30px;align-items:start}
.field label,.displayField .label{display:block;font-size:17px;margin-bottom:9px;color:#111}.req{color:red;margin-right:2px}.control{width:100%;height:56px;border:1px solid #d9deea;border-radius:6px;background:#fff;padding:0 16px;font-size:18px;color:#111;outline:none}.control:focus,textarea:focus{border-color:#8693e6;box-shadow:0 0 0 3px #8693e61a}
.studentSelect{color:#5d647b}.displayValue{height:56px;display:flex;align-items:center;padding:0 2px;font-size:18px;color:#111}
.violationScope{display:flex;align-items:center;gap:20px;min-height:38px;flex-wrap:wrap}.radioLabel{display:inline-flex;align-items:center;gap:8px;font-size:17px;cursor:pointer}.radioLabel input{appearance:none;width:28px;height:28px;border:1px solid #cbd1df;border-radius:50%;display:grid;place-items:center;margin:0}.radioLabel input:checked:before{content:"";width:10px;height:10px;border-radius:50%;background:#b9c4e7}.info{width:20px;height:20px;border-radius:50%;background:#5d6cdf;color:#fff;display:inline-grid;place-items:center;font-size:13px;font-weight:900}
.violationSelectWrap{margin-top:12px}.wide{grid-column:1/-1}.wide2{grid-column:span 2}.textarea{width:100%;min-height:128px;border:1px solid #d9deea;border-radius:6px;padding:14px 16px;font-size:17px;resize:vertical}
.optional{color:#f11;font-weight:400}.footerActions{display:flex;gap:12px;justify-content:flex-start;padding-top:8px;flex-wrap:wrap}.btn{border:0;border-radius:7px;min-height:50px;padding:0 24px;font-size:16px;font-weight:800;cursor:pointer}.btnPrimary{background:#5865c8;color:#fff}.btnGreen{background:#0f8c68;color:#fff}.btnLight{background:#fff;border:1px solid #d7dce8;color:#363c56}
.alert{padding:12px 16px;border-radius:7px;margin-bottom:18px;font-size:15px}.alert.err{background:#fff0f3;color:#a01637;border:1px solid #ffc3d0}.alert.ok{background:#edf9f4;color:#176748;border:1px solid #ccebdc}
.listHeader{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}.listTools{display:flex;gap:8px;flex-wrap:wrap}.smallCtrl{height:42px;border:1px solid #d9deea;border-radius:7px;padding:0 10px}.tableWrap{overflow:auto;max-height:68vh}.tbl{width:100%;border-collapse:collapse;min-width:1000px}.tbl th,.tbl td{padding:12px 10px;border-bottom:1px solid #eceff5;text-align:right;font-size:13px}.tbl th{position:sticky;top:0;background:#f8f9fc;z-index:2}.status{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:900}.new{background:#e8edff;color:#3d56c4}.in_progress{background:#fff2d9;color:#986600}.referred{background:#eee6ff;color:#6843b7}.closed{background:#e5f7ed;color:#16734a}.hidden{display:none!important}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{display:flex;gap:6px;overflow:auto;padding:8px;position:sticky;top:0;z-index:20}.brand{display:none}.sideBtn{min-width:max-content;width:auto;margin:0;padding:10px 12px;font-size:12px}.sideBtn .dot{display:none}.back{margin-top:0}.formGrid{grid-template-columns:1fr 1fr}.formArea{padding:22px}.wide2{grid-column:span 2}}
@media(max-width:650px){.formGrid{grid-template-columns:1fr;gap:18px}.wide2{grid-column:span 1}.formArea{padding:16px}.panelTitle{padding:18px;font-size:18px}.main{padding:10px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand">إشعار</div>
  <button class="sideBtn" onclick="location.href='/'"><span>الرئيسية</span><span class="dot"></span></button>
  <button class="sideBtn active" id="navAdd"><span>إضافة مخالفة طالب</span><span class="dot"></span></button>
  <button class="sideBtn" id="navList"><span>الحالات السلوكية</span><span class="dot"></span></button>
  <button class="sideBtn" onclick="location.href='/'"><span>إدارة الطلاب</span><span class="dot"></span></button>
  <button class="sideBtn back" onclick="location.href='/'"><span>العودة للنظام</span></button>
</aside>

<main class="main">
  <div id="message"></div>

  <section id="addView" class="panel">
    <div class="panelTitle">إضافة مخالفة طالب</div>
    <div class="formArea">
      <div class="formGrid">
        <div class="field">
          <label>الصف:</label>
          <select id="grade" class="control"><option value="">الكل</option></select>
        </div>

        <div class="field">
          <label>الفصل:</label>
          <select id="classroom" class="control"><option value="">الكل</option></select>
        </div>

        <div class="field">
          <label>اسم الطالب <span class="req">*</span></label>
          <select id="student" class="control studentSelect"><option value="">اختر الطالب...</option></select>
          <div id="studentCountHint" style="font-size:12px;color:#7b839a;margin-top:6px"></div>
        </div>

        <div class="field">
          <label>المخالفة:<span class="req">*</span></label>
          <div class="violationScope">
            <label class="radioLabel"><input type="radio" name="scope" value="public" checked> العامة</label>
            <label class="radioLabel"><input type="radio" name="scope" value="private"> الخاصة</label>
            <label class="radioLabel"><input type="radio" name="scope" value="cases"> الحالات</label>
            <span class="info">i</span>
          </div>
          <div class="violationSelectWrap">
            <select id="violation" class="control"><option value="">اختر المخالفة...</option></select>
          </div>
        </div>

        <div class="displayField">
          <div class="label">نوع المخالفة:</div>
          <div id="violationType" class="displayValue">-</div>
        </div>

        <div class="displayField">
          <div class="label">درجة المخالفة:</div>
          <div id="violationDegree" class="displayValue">-</div>
        </div>

        <div class="field">
          <label>تاريخ المخالفة:<span class="req">*</span></label>
          <input id="violationDate" class="control" type="date">
        </div>

        <div class="field">
          <label>مصدر المخالفة:<span class="req">*</span></label>
          <select id="source" class="control">
            <option>مدير المدرسة</option>
            <option>وكيل شؤون الطلاب</option>
            <option>الموجه الطلابي</option>
            <option>معلم</option>
            <option>إداري</option>
          </select>
        </div>

        <div></div>

        <div class="field wide">
          <label>وصف المشكلة <span class="optional">(اختياري)</span></label>
          <textarea id="description" class="textarea" placeholder=""></textarea>
        </div>

        <div class="field wide2">
          <label>الإجراء المتخذ <span class="optional">(اختياري)</span></label>
          <textarea id="actionTaken" class="textarea" style="min-height:95px"></textarea>
        </div>

        <div class="field">
          <label>تحويل الحالة</label>
          <select id="referralTarget" class="control">
            <option value="">بدون تحويل</option>
            <option>وكيل شؤون الطلاب</option>
            <option>الموجه الطلابي</option>
            <option>مدير المدرسة</option>
          </select>
        </div>

        <div class="wide footerActions">
          <button id="saveBtn" class="btn btnPrimary">حفظ المخالفة</button>
          <button id="saveNotifyBtn" class="btn btnGreen">حفظ وإشعار ولي الأمر</button>
          <button id="clearBtn" class="btn btnLight">تفريغ النموذج</button>
        </div>
      </div>
    </div>
  </section>

  <section id="listView" class="panel hidden">
    <div class="listHeader">
      <div class="panelTitle" style="border:0;padding:0">الحالات السلوكية المسجلة</div>
      <div class="listTools">
        <input id="search" class="smallCtrl" placeholder="بحث باسم الطالب أو السجل">
        <select id="statusFilter" class="smallCtrl">
          <option value="">كل الحالات</option><option value="new">جديدة</option><option value="in_progress">قيد المعالجة</option><option value="referred">محالة</option><option value="closed">مغلقة</option>
        </select>
        <button id="refreshBtn" class="btn btnLight" style="min-height:42px">تحديث</button>
      </div>
    </div>
    <div class="tableWrap"><table class="tbl"><thead><tr><th>#</th><th>الطالب</th><th>الصف/الفصل</th><th>المخالفة</th><th>الدرجة</th><th>المصدر</th><th>التاريخ</th><th>الراصد</th><th>الحالة</th></tr></thead><tbody id="casesBody"></tbody></table></div>
  </section>
</main>
</div>

<script>
const API='https://shurahbil-api.onrender.com/api';
const token=localStorage.getItem('cloudAdminToken')||'';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let students=[],cases=[];

const CATALOG={
  public:[
    {name:'عدم التقيد بالزي المدرسي',type:'مخالفة سلوكية',degree:'الأولى',severity:'low'},
    {name:'التأخر عن الاصطفاف الصباحي',type:'مخالفة انضباطية',degree:'الأولى',severity:'low'},
    {name:'التأخر عن الحصة',type:'مخالفة انضباطية',degree:'الأولى',severity:'low'},
    {name:'الخروج من الفصل دون إذن',type:'مخالفة سلوكية',degree:'الثانية',severity:'medium'},
    {name:'إثارة الفوضى داخل الفصل',type:'مخالفة سلوكية',degree:'الثانية',severity:'medium'},
    {name:'عدم احترام أنظمة المدرسة وتعليماتها',type:'مخالفة سلوكية',degree:'الثانية',severity:'medium'},
    {name:'الإساءة اللفظية للزملاء',type:'مخالفة سلوكية',degree:'الثالثة',severity:'high'},
    {name:'العبث بممتلكات المدرسة',type:'مخالفة سلوكية',degree:'الثالثة',severity:'high'},
    {name:'استخدام الجوال أثناء اليوم الدراسي',type:'مخالفة سلوكية',degree:'الثالثة',severity:'high'},
    {name:'المشاجرة أو الاعتداء على طالب',type:'مخالفة سلوكية',degree:'الرابعة',severity:'critical'},
    {name:'عدم أداء الواجبات أو المهمات الصفية',type:'مخالفة تعليمية',degree:'الأولى',severity:'low'},
    {name:'إحضار أدوات أو مواد غير مرتبطة بالدراسة',type:'مخالفة سلوكية',degree:'الثانية',severity:'medium'},
    {name:'الكتابة أو الرسم على الجدران والمقاعد',type:'مخالفة سلوكية',degree:'الثالثة',severity:'high'},
    {name:'انتحال صفة الغير أو التوقيع عنه',type:'مخالفة سلوكية',degree:'الثالثة',severity:'high'},
    {name:'التنمر أو السخرية أو التهديد',type:'مخالفة سلوكية',degree:'الرابعة',severity:'critical'}
  ],
  private:[
    {name:'الإساءة اللفظية للمعلم أو الإداري',type:'مخالفة خاصة',degree:'الرابعة',severity:'critical'},
    {name:'الاعتداء الجسدي على أحد منسوبي المدرسة',type:'مخالفة خاصة',degree:'الخامسة',severity:'critical'},
    {name:'التصوير دون إذن داخل المدرسة',type:'مخالفة خاصة',degree:'الثالثة',severity:'high'},
    {name:'التدخين أو حيازة أدواته',type:'مخالفة خاصة',degree:'الرابعة',severity:'critical'},
    {name:'إتلاف الممتلكات عمدًا',type:'مخالفة خاصة',degree:'الرابعة',severity:'critical'},
    {name:'حيازة مواد أو أدوات محظورة',type:'مخالفة خاصة',degree:'الخامسة',severity:'critical'}
  ],
  cases:[
    {name:'غياب متكرر يحتاج متابعة',type:'حالة طلابية',degree:'متابعة',severity:'medium'},
    {name:'تأخر صباحي متكرر',type:'حالة طلابية',degree:'متابعة',severity:'medium'},
    {name:'هروب متكرر من الحصص',type:'حالة طلابية',degree:'متابعة',severity:'high'},
    {name:'تنمر متكرر',type:'حالة طلابية',degree:'متابعة عاجلة',severity:'high'},
    {name:'حالة تحتاج تدخل الموجه الطلابي',type:'حالة طلابية',degree:'متابعة عاجلة',severity:'high'},
    {name:'حالة أخرى',type:'حالة طلابية',degree:'حسب التقييم',severity:'medium'}
  ]
};

async function api(action,payload={}){
  if(!token) throw new Error('يلزم تسجيل الدخول إلى النظام أولًا');
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-app-token':token},body:JSON.stringify({action,...payload})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}
function message(t,ok=false){$('message').innerHTML='<div class="alert '+(ok?'ok':'err')+'">'+esc(t)+'</div>';setTimeout(()=>{$('message').innerHTML=''},5000)}
function scope(){return document.querySelector('input[name="scope"]:checked')?.value||'public'}
function fillViolations(){
  const arr=CATALOG[scope()]||[];
  $('violation').innerHTML='<option value="">اختر المخالفة...</option>'+arr.map((x,i)=>'<option value="'+i+'">'+esc(x.name)+'</option>').join('');
  $('violationType').textContent='-';$('violationDegree').textContent='-';
}
function selectedViolation(){
  const idx=Number($('violation').value);
  if($('violation').value==='')return null;
  return (CATALOG[scope()]||[])[idx]||null;
}
function updateViolationMeta(){const v=selectedViolation();$('violationType').textContent=v?.type||'-';$('violationDegree').textContent=v?.degree||'-'}
function normGrade(v){
  const s=String(v||'').replace(/\s+/g,' ').trim();
  if(/أول|اول/.test(s)) return 'الأول الثانوي';
  if(/ثاني/.test(s)) return 'الثاني الثانوي';
  if(/ثالث/.test(s)) return 'الثالث الثانوي';
  return s;
}
function normClass(v){
  let s=String(v||'').replace(/فصل|الفصل|الصف/g,'').trim();
  const m=s.match(/[أابجدهـهو]/);
  if(m){
    const x=m[0];
    if(x==='ا') return 'أ';
    if(x==='ه') return 'هـ';
    if(x==='و') return 'و';
    return x;
  }
  return s;
}
function fillFilters(){
  const canonicalGrades=['الأول الثانوي','الثاني الثانوي','الثالث الثانوي'];
  const discoveredGrades=[...new Set(students.map(s=>normGrade(s.grade)).filter(Boolean))];
  const grades=[...new Set([...canonicalGrades,...discoveredGrades])];
  const canonicalClasses=['أ','ب','ج','د','هـ','و'];
  const discoveredClasses=[...new Set(students.map(s=>normClass(s.classroom)).filter(Boolean))];
  const classes=[...new Set([...canonicalClasses,...discoveredClasses])];
  $('grade').innerHTML='<option value="">الكل</option>'+grades.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  $('classroom').innerHTML='<option value="">الكل</option>'+classes.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
  refreshStudents();
}
function refreshStudents(){
  const g=$('grade').value,c=$('classroom').value;
  const rows=students.filter(s=>(!g||normGrade(s.grade)===g)&&(!c||normClass(s.classroom)===c)).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ar'));
  $('student').innerHTML='<option value="">اختر الطالب...</option>'+rows.map(s=>'<option value="'+esc(s.idno)+'">'+esc(s.name)+' — '+esc(normGrade(s.grade))+' / '+esc(normClass(s.classroom))+'</option>').join('');
  $('studentCountHint').textContent=rows.length?'عدد الطلاب المطابقين: '+rows.length:'لا يوجد طلاب مطابقون لهذا الصف والفصل';
}
function clearForm(){
  $('student').value='';$('description').value='';$('actionTaken').value='';$('referralTarget').value='';$('violation').value='';$('violationType').textContent='-';$('violationDegree').textContent='-';
}
async function loadStudents(){
  let local=[];
  try{
    const raw=JSON.parse(localStorage.getItem('students')||'[]');
    if(Array.isArray(raw)) local=raw;
  }catch(e){}
  let remote=[];
  try{
    const d=await api('list_students_with_credentials');
    if(Array.isArray(d.students)) remote=d.students;
  }catch(e){console.warn('students api',e)}
  const byId=new Map();
  [...local,...remote].forEach(s=>{
    const id=String(s.idno||s.civil_id||'').replace(/\D/g,'');
    if(!id)return;
    byId.set(id,{
      idno:id,
      name:String(s.name||'').trim(),
      phone:String(s.phone||'').trim(),
      grade:String(s.grade||'').trim(),
      classroom:String(s.classroom||'').trim()
    });
  });
  students=[...byId.values()];
  fillFilters();
}
async function loadCases(){const d=await api('list_behavior_cases');cases=d.rows||[];renderCases()}
function renderCases(){
  const q=$('search').value.trim().toLowerCase(),st=$('statusFilter').value;
  const rows=cases.filter(x=>(!q||[x.student_name,x.student_idno,x.violation_name,x.case_type].join(' ').toLowerCase().includes(q))&&(!st||x.status===st));
  const label={new:'جديدة',in_progress:'قيد المعالجة',referred:'محالة',closed:'مغلقة'};
  $('casesBody').innerHTML=rows.map(x=>'<tr><td>#'+x.id+'</td><td><b>'+esc(x.student_name)+'</b><div>'+esc(x.student_idno)+'</div></td><td>'+esc(x.grade)+' / '+esc(x.classroom)+'</td><td>'+esc(x.violation_name||x.case_type)+'</td><td>'+esc(x.violation_degree||'-')+'</td><td>'+esc(x.violation_source||'-')+'</td><td>'+esc(x.violation_date||'-')+'</td><td>'+esc(x.reported_by_name||'-')+'</td><td><span class="status '+esc(x.status)+'">'+esc(label[x.status]||x.status)+'</span></td></tr>').join('');
}
async function save(notify){
  const v=selectedViolation();
  if(!$('student').value)return alert('اختر الطالب');
  if(!v)return alert('اختر المخالفة');
  if(!$('violationDate').value)return alert('حدد تاريخ المخالفة');
  const btn=notify?$('saveNotifyBtn'):$('saveBtn');const old=btn.textContent;btn.disabled=true;btn.textContent='جاري الحفظ...';
  try{
    const row=await api('create_behavior_case',{
      student_idno:$('student').value,
      case_type:v.type,
      violation_scope:scope(),
      violation_name:v.name,
      violation_category:v.type,
      violation_degree:v.degree,
      violation_source:$('source').value,
      violation_date:$('violationDate').value,
      description:$('description').value.trim()||v.name,
      severity:v.severity,
      action_taken:$('actionTaken').value.trim(),
      referral_target:$('referralTarget').value,
      guardian_notified:!!notify
    });
    if(notify){
      const st=students.find(s=>String(s.idno)===String($('student').value));
      let p=String(st?.phone||'').replace(/\D/g,'');
      if(p.startsWith('05'))p='966'+p.slice(1);else if(p.startsWith('5'))p='966'+p;
      if(p) window.open('https://wa.me/'+p+'?text='+encodeURIComponent('السلام عليكم، نفيدكم بتسجيل مخالفة للطالب '+(st?.name||'')+' وهي: '+v.name+'. نأمل التواصل مع المدرسة للمتابعة.'),'_blank');
      else alert('تم حفظ المخالفة، ولا يوجد رقم جوال مسجل لولي الأمر.');
    }
    await loadCases();clearForm();message('تم حفظ المخالفة بنجاح',true);
  }catch(e){message(e.message)}
  finally{btn.disabled=false;btn.textContent=old}
}
function switchView(v){
  const add=v==='add';$('addView').classList.toggle('hidden',!add);$('listView').classList.toggle('hidden',add);$('navAdd').classList.toggle('active',add);$('navList').classList.toggle('active',!add);if(!add)loadCases().catch(e=>message(e.message));
}
$('navAdd').onclick=()=>switchView('add');$('navList').onclick=()=>switchView('list');
$('grade').onchange=refreshStudents;$('classroom').onchange=refreshStudents;$('student').onchange=()=>{const s=students.find(x=>String(x.idno)===String($('student').value));if(s){$('grade').value=normGrade(s.grade);$('classroom').value=normClass(s.classroom)}};document.querySelectorAll('input[name="scope"]').forEach(r=>r.onchange=fillViolations);$('violation').onchange=updateViolationMeta;
$('saveBtn').onclick=()=>save(false);$('saveNotifyBtn').onclick=()=>save(true);$('clearBtn').onclick=clearForm;$('search').oninput=renderCases;$('statusFilter').onchange=renderCases;$('refreshBtn').onclick=()=>loadCases().catch(e=>message(e.message));
$('violationDate').value=new Date().toISOString().slice(0,10);
(async()=>{try{if(!token){message('يلزم الدخول إلى النظام أولًا ثم فتح صفحة الحالات السلوكية.');return}await Promise.all([loadStudents(),loadCases()]);fillViolations()}catch(e){message(e.message)}})();
</script>
