<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>استرداد سجلات التأخر</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f3f7f6;margin:0;color:#153b35}
.wrap{max-width:1100px;margin:24px auto;padding:16px}
.card{background:#fff;border:1px solid #d9e4e1;border-radius:18px;padding:18px;box-shadow:0 8px 28px #0001;margin-bottom:14px}
h1{margin:0 0 8px;font-size:28px}.sub{color:#56756e;line-height:1.8}
button{border:0;border-radius:14px;padding:14px 22px;font-size:18px;font-weight:800;cursor:pointer;background:#0f766e;color:#fff}
button.secondary{background:#fff;color:#0f766e;border:1px solid #0f766e}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:#eef7f5;border-radius:14px;padding:14px}.stat b{display:block;font-size:30px;margin-top:5px}
.ok{background:#ecfdf5;border:1px solid #a7f3d0}.warn{background:#fff7ed;border:1px solid #fed7aa}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
th,td{border-bottom:1px solid #e5ece9;padding:10px;text-align:right;vertical-align:top}
th{background:#eef5f3;position:sticky;top:0}
.tablewrap{overflow:auto;max-height:65vh}
.hidden{display:none}
.small{font-size:12px;color:#678}
code{direction:ltr;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>♻️ استرداد سجلات التأخر</h1>
    <div class="sub">
      هذه الصفحة تفحص النسخة المحلية المحفوظة في <b>هذا الجهاز وهذا المتصفح فقط</b>.
      لا تحذف ولا تعدل أي بيانات. تبحث خصوصًا عن تأخرات 11 و12 أكتوبر 2026.
    </div>
    <div class="actions">
      <button id="scanBtn">🔎 فحص واسترداد التأخر</button>
      <button id="saveBtn" class="secondary hidden">💾 حفظ نسخة من النتائج</button>
    </div>
    <div id="status" class="card warn">اضغط زر الفحص.</div>
    <div id="stats" class="stats hidden"></div>
    <div id="selectionDiag" class="card warn hidden"></div><div id="preCloudDiag" class="card warn hidden"></div><div id="allSelectionsDiag" class="card warn hidden"></div>
    <div id="backupDiag" class="card warn hidden"></div><div id="backupLateDiag" class="card warn hidden"></div><div id="rawStorageDiag" class="card warn hidden"></div>
  </div>
  <div id="resultCard" class="card hidden">
    <h2>السجلات الموجودة في الجهاز</h2>
    <div id="sources" class="small"></div>
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th>الطالب</th><th>السجل المدني</th><th>التاريخ</th><th>الوقت</th><th>الصف/الفصل</th><th>الراصد</th><th>مصدر النسخة</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </div>
</div>
<script>
(function(){
  const dates=new Set(['2026-10-11','2026-10-12']);
  let foundRows=[];
  const safeJson=s=>{try{return JSON.parse(s)}catch(e){return null}};
  function normRow(x,source){
    if(!x||typeof x!=='object') return null;
    const status=String(x.status||x.state||'').trim().toLowerCase();
    const date=String(x.date||x.gregorianDate||x.attendance_date||'').trim();
    if(status!=='late'||!dates.has(date)) return null;
    return {
      name:String(x.name||x.student_name||x.studentName||'').trim(),
      idno:String(x.idno||x.student_idno||x.civil_id||x.studentCivilId||'').trim(),
      date,
      time:String(x.time||x.attendance_time||'').trim(),
      grade:String(x.grade||'').trim(),
      classroom:String(x.classroom||x.class||'').trim(),
      teacher:String(x.teacherName||x.teacher_name||x.recorderName||'').trim(),
      teacherUsername:String(x.teacherUsername||x.teacher_username||x.teacherCivilId||x.teacher_civil_id||'').trim(),
      period:String(x.period??'').trim(),
      source
    };
  }
  function addArray(arr,source,out){
    if(!Array.isArray(arr)) return;
    for(const x of arr){const r=normRow(x,source);if(r) out.push(r)}
  }
  function deepScan(v,source,out,depth){
    if(depth>8||v==null) return;
    if(typeof v==='string'){
      const p=safeJson(v);
      if(p!==null) deepScan(p,source+' → JSON',out,depth+1);
      return;
    }
    if(Array.isArray(v)){ addArray(v,source,out); for(const x of v) deepScan(x,source,out,depth+1); return; }
    if(typeof v==='object'){
      const r=normRow(v,source); if(r) out.push(r);
      for(const [k,x] of Object.entries(v)){
        deepScan(x,source+' → '+k,out,depth+1);
      }
    }
  }
  function collectBackupLateRows(v,source,out,depth=0){
    if(depth>8||v==null) return;
    if(typeof v==='string'){
      const p=safeJson(v);
      if(p!==null) collectBackupLateRows(p,source+' → JSON',out,depth+1);
      return;
    }
    if(Array.isArray(v)){ for(const x of v) collectBackupLateRows(x,source,out,depth+1); return; }
    if(typeof v==='object'){
      if(String(v.status||v.state||'').trim().toLowerCase()==='late'){
        out.push({
          name:String(v.name||v.student_name||v.studentName||'').trim(),
          idno:String(v.idno||v.student_idno||v.civil_id||v.studentCivilId||'').trim(),
          date:String(v.date||v.gregorianDate||v.attendance_date||'').trim(),
          time:String(v.time||v.attendance_time||'').trim(),
          source
        });
      }
      for(const x of Object.values(v)) collectBackupLateRows(x,source,out,depth+1);
    }
  }
  function scan(){
    const out=[], inspected=[], backupLateRows=[];
    const selectionKey='attendanceLateSelections:2026-10-12';
    const selectionRaw=localStorage.getItem(selectionKey);
    const selectionParsed=safeJson(selectionRaw||'[]');
    const selectedIds=Array.isArray(selectionParsed)?selectionParsed.map(x=>String(x||'').trim()).filter(Boolean):[];
    let students=[];
    for(const k of ['students','studentRoster','studentRosterSafetyBackup:v1']){
      const v=safeJson(localStorage.getItem(k)||'');
      if(Array.isArray(v)){ students=v; break; }
    }
    const byId=new Map(students.map(st=>[
      String(st?.idno||st?.civil_id||st?.studentCivilId||'').trim(),
      st
    ]));
    for(const id of selectedIds){
      const st=byId.get(id)||{};
      out.push({
        name:String(st?.name||st?.student_name||'').trim(),
        idno:id,date:'2026-10-12',time:'',
        grade:String(st?.grade||'').trim(),
        classroom:String(st?.classroom||st?.class||'').trim(),
        teacher:'',teacherUsername:'',period:'',
        source:selectionKey
      });
    }
    if(selectionRaw!==null) inspected.push(selectionKey);

    const backupInfo=[];
    for(let n=1;n<=20;n++){
      const k='weeklyAttendanceSafetyBackup:v1:'+n;
      const raw=localStorage.getItem(k);
      if(raw===null) continue;
      const parsed=safeJson(raw);
      backupInfo.push({
        key:k,
        chars:raw.length,
        jsonType:Array.isArray(parsed)?'array':(parsed&&typeof parsed==='object'?'object':typeof parsed),
        hasDate:raw.includes('2026-10-12'),
        hasLate:/\blate\b/i.test(raw),
        preview:raw.slice(0,220)
      });
      inspected.push(k);
      if(parsed!==null){
        deepScan(parsed,k,out,0);
        collectBackupLateRows(parsed,k,backupLateRows,0);
      }
    }
    window.__lateBackupInfo=backupInfo;
    window.__backupLateRows=backupLateRows;
    const rawHits=[];
    function scanStorageArea(store,storeName){
      for(let i=0;i<store.length;i++){
        const key=store.key(i);
        const raw=store.getItem(key);
        if(raw===null) continue;
        const source=storeName+':'+key;
        inspected.push(source);
        const parsed=safeJson(raw);
        if(parsed!==null){
          deepScan(parsed,source,out,0);
        }else{
          // even non-JSON text may contain a serialized fragment or direct date/status evidence.
          if(/2026-10-12|["']?status["']?\s*[:=]\s*["']?late|تأخر/i.test(raw)){
            rawHits.push({source,chars:raw.length,preview:raw.slice(0,1200)});
          }
        }
        if(/2026-10-12|["']?status["']?\s*[:=]\s*["']?late|attendanceLateSelections/i.test(raw)){
          if(!rawHits.some(x=>x.source===source)){
            rawHits.push({source,chars:raw.length,preview:raw.slice(0,1200)});
          }
        }
      }
    }
    scanStorageArea(localStorage,'localStorage');
    scanStorageArea(sessionStorage,'sessionStorage');
    window.__rawStorageHits=rawHits;
    const seen=new Set(), uniq=[];
    for(const r of out){
      const k=[r.idno,r.name,r.date,r.time,r.period,r.teacherUsername,r.teacher].join('|');
      if(seen.has(k)) continue; seen.add(k); uniq.push(r);
    }
    uniq.sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)||a.name.localeCompare(b.name,'ar'));
    foundRows=uniq;
    render(uniq,inspected);
  }
  function render(rows,inspected){
    const s=document.getElementById('status'), stats=document.getElementById('stats'), card=document.getElementById('resultCard');
    const by11=rows.filter(x=>x.date==='2026-10-11').length, by12=rows.filter(x=>x.date==='2026-10-12').length;
    const named=rows.filter(x=>x.name).length;
    const selectionKey='attendanceLateSelections:2026-10-12';
    const selectionRaw=localStorage.getItem(selectionKey);
    const selectionParsed=safeJson(selectionRaw||'');
    const selectionIds=Array.isArray(selectionParsed)?selectionParsed.map(x=>String(x||'').trim()).filter(Boolean):[];
    let students=[];
    for(const k of ['students','studentRoster','studentRosterSafetyBackup:v1']){
      const v=safeJson(localStorage.getItem(k)||'');
      if(Array.isArray(v)){ students=v; break; }
    }
    const byId=new Map(students.map(st=>[
      String(st?.idno||st?.civil_id||st?.studentCivilId||'').trim(),
      st
    ]));
    const matched=selectionIds.map(id=>({id,st:byId.get(id)}));
    const diag=document.getElementById('selectionDiag');
    diag.classList.remove('hidden');
    diag.className='card '+(selectionRaw!==null?'ok':'warn');
    diag.innerHTML=
      '<b>🔐 فحص مفتاح الاثنين مباشرة</b><br>'+
      'المفتاح موجود: <b>'+(selectionRaw!==null?'نعم':'لا')+'</b><br>'+
      'عدد العناصر داخله: <b>'+selectionIds.length+'</b><br>'+
      'أسماء مطابقة في قائمة الطلاب: <b>'+matched.filter(x=>x.st).length+'</b><br>'+
      '<div style="margin-top:8px;word-break:break-all">القيمة الخام: <code>'+esc(selectionRaw===null?'(غير موجود)':selectionRaw)+'</code></div>'+
      (selectionIds.length?'<div style="margin-top:8px"><b>المحتويات:</b><br>'+matched.map((x,i)=>(i+1)+'. '+esc(x.st?.name||'غير معروف')+' — '+esc(x.id)).join('<br>')+'</div>':'');
    const preCloudKey='attendanceLogPreCloudRecovery_20261013';
    const preCloudRaw=localStorage.getItem(preCloudKey);
    const preCloudParsed=safeJson(preCloudRaw||'');
    const preCloudRows=Array.isArray(preCloudParsed)?preCloudParsed:[];
    const preCloudLate12=preCloudRows.filter(x=>String(x?.status||'').toLowerCase()==='late' && String(x?.date||'')==='2026-10-12');
    const preDiag=document.getElementById('preCloudDiag');
    preDiag.classList.remove('hidden');
    preDiag.className='card '+(preCloudRaw!==null?'ok':'warn');
    preDiag.innerHTML='<b>🧬 فحص نسخة ما قبل المزامنة 13 أكتوبر</b><br>'+
      'المفتاح موجود: <b>'+(preCloudRaw!==null?'نعم':'لا')+'</b><br>'+
      'حجم القيمة: <b>'+(preCloudRaw?preCloudRaw.length:0)+'</b> حرف<br>'+
      'عدد الصفوف داخلها: <b>'+preCloudRows.length+'</b><br>'+
      'تأخرات 12 أكتوبر داخلها: <b>'+preCloudLate12.length+'</b><br>'+
      (preCloudLate12.length?'<div style="margin-top:8px">'+preCloudLate12.map((x,i)=>(i+1)+'. '+esc(x.name||x.student_name||'')+' — '+esc(x.idno||'')+' — '+esc(x.time||'')).join('<br>')+'</div>':'');
    const backupDiag=document.getElementById('backupDiag');
    const infos=Array.isArray(window.__lateBackupInfo)?window.__lateBackupInfo:[];
    backupDiag.classList.remove('hidden');
    backupDiag.className='card '+(infos.length?'ok':'warn');
    backupDiag.innerHTML=
      '<b>🧰 فحص نسخ الأمان weeklyAttendanceSafetyBackup</b><br>'+
      'عدد النسخ الموجودة: <b>'+infos.length+'</b><br>'+
      (infos.length?infos.map((x,i)=>
        (i+1)+'. <code>'+esc(x.key)+'</code> — '+x.chars+' حرف — '+esc(x.jsonType)+
        ' — تاريخ 12 أكتوبر: <b>'+(x.hasDate?'نعم':'لا')+'</b>'+
        ' — late: <b>'+(x.hasLate?'نعم':'لا')+'</b>'+
        '<div style="font-size:12px;word-break:break-all;margin:4px 0 10px">'+esc(x.preview)+'</div>'
      ).join(''):'لا توجد نسخ أمان من هذا النوع.');

    const backupLateDiag=document.getElementById('backupLateDiag');
    const backupLateRows=Array.isArray(window.__backupLateRows)?window.__backupLateRows:[];
    backupLateDiag.classList.remove('hidden');
    backupLateDiag.className='card '+(backupLateRows.length?'ok':'warn');
    backupLateDiag.innerHTML='<b>⏰ كل سجلات late داخل نسخ الأمان</b><br>'+
      'العدد: <b>'+backupLateRows.length+'</b><br>'+
      (backupLateRows.length?backupLateRows.map((x,i)=>
        (i+1)+'. '+esc(x.name||'غير معروف')+' — '+esc(x.idno||'—')+' — '+esc(x.date||'بدون تاريخ')+' '+esc(x.time||'')+
        ' — <code>'+esc(x.source)+'</code>'
      ).join('<br>'):'لا توجد سجلات late فعلية داخل نسخ الأمان.');
    const allSel=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!/^attendanceLateSelections:/.test(String(k||''))) continue;
      const raw=localStorage.getItem(k);
      const parsed=safeJson(raw||'[]');
      const ids=Array.isArray(parsed)?parsed.map(x=>String(x||'').trim()).filter(Boolean):[];
      allSel.push({key:k,ids});
    }
    allSel.sort((a,b)=>a.key.localeCompare(b.key));
    const allDiag=document.getElementById('allSelectionsDiag');
    allDiag.classList.remove('hidden');
    allDiag.className='card '+(allSel.length?'ok':'warn');
    allDiag.innerHTML='<b>📅 كل مفاتيح تحديدات التأخر</b><br>'+
      (allSel.length?allSel.map(x=>{
        const names=x.ids.map(id=>byId.get(id)?.name||id);
        return '<div style="margin-top:8px"><code>'+esc(x.key)+'</code> — العدد: <b>'+x.ids.length+'</b>'+
          (names.length?'<br>'+names.map((n,i)=>(i+1)+'. '+esc(n)).join('، '):'')+'</div>';
      }).join(''):'لا توجد مفاتيح تحديدات تأخر.');
    const rawDiag=document.getElementById('rawStorageDiag');
    const rawHits=Array.isArray(window.__rawStorageHits)?window.__rawStorageHits:[];
    rawDiag.classList.remove('hidden');
    rawDiag.className='card '+(rawHits.length?'ok':'warn');
    rawDiag.innerHTML='<b>🧪 فحص شامل لكل تخزين المتصفح</b><br>'+
      'المفاتيح التي تحتوي أثرًا مباشرًا لـ 12 أكتوبر أو late: <b>'+rawHits.length+'</b><br>'+
      (rawHits.length?rawHits.map((x,i)=>
        '<div style="margin-top:10px"><b>'+(i+1)+'. '+esc(x.source)+'</b> — '+x.chars+' حرف'+
        '<div style="font-size:12px;word-break:break-all;margin-top:4px">'+esc(x.preview)+'</div></div>'
      ).join(''):'لم يظهر أثر خام إضافي خارج السجلات التي استخرجناها.');
    s.className='card '+(rows.length?'ok':'warn');
    s.innerHTML=rows.length
      ? '<b>✅ وجدت '+rows.length+' سجل تأخر محفوظًا في هذا الجهاز.</b><br>لا تمسح بيانات المتصفح قبل حفظ النتائج.'
      : '<b>لم أجد سجلات تأخر ليومي 11 أو 12 أكتوبر في التخزين المحلي لهذا الأصل.</b>';
    stats.classList.remove('hidden');
    stats.innerHTML='<div class="stat">الإجمالي<b>'+rows.length+'</b></div><div class="stat">11 أكتوبر<b>'+by11+'</b></div><div class="stat">12 أكتوبر<b>'+by12+'</b></div><div class="stat">بأسماء واضحة<b>'+named+'</b></div>';
    card.classList.toggle('hidden',!rows.length);
    document.getElementById('saveBtn').classList.toggle('hidden',!rows.length);
    document.getElementById('sources').textContent='مفاتيح التخزين التي تم فحصها: '+(inspected.join('، ')||'لا يوجد');
    document.getElementById('tbody').innerHTML=rows.map((r,i)=>'<tr>'+
      '<td>'+(i+1)+'</td><td>'+esc(r.name||'—')+'</td><td>'+esc(r.idno||'—')+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.time||'—')+'</td>'+
      '<td>'+esc((r.grade||'—')+' / '+(r.classroom||'—'))+'</td><td>'+esc((r.teacher||'—')+(r.teacherUsername?' ('+r.teacherUsername+')':''))+'</td><td>'+esc(r.source)+'</td></tr>').join('');
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  document.getElementById('scanBtn').onclick=scan;
  document.getElementById('saveBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify({createdAt:new Date().toISOString(),origin:location.origin,rows:foundRows},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='recovered-late-2026-10-11-12.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  };
})();
</script>
</body></html>
